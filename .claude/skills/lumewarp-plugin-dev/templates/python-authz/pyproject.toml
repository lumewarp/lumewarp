[project]
name = "my-lumewarp-authz"
version = "0.1.0"
requires-python = ">=3.12"
# The control plane is already installed where the plugin runs; do not list it
# here, or installing the plugin may replace the control plane's own version.
dependencies = ["httpx>=0.28"]

[project.entry-points."lumewarp.authz"]
my-authz = "my_lumewarp_authz:create"

[dependency-groups]
dev = [
    # Pin the tag of the control plane release the plugin is deployed to.
    "lumewarp-control-plane @ git+https://github.com/lumewarp/lumewarp@v0.1.0#subdirectory=control-plane",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
