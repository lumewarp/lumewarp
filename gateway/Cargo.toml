[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/lumewarp/lumewarp"

[workspace.dependencies]
lumewarp-config = { path = "crates/lumewarp-config" }
lumewarp-proto = { path = "crates/lumewarp-proto" }

anyhow = "1"
arc-swap = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
http-body-util = "0.1"
httpdate = "1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "webpki-roots", "ring", "tls12"] }
sha2 = "0.10"
hex = "0.4"
fastrand = "2"
prometheus-client = "0.24"
papaya = "0.2.3"
opentelemetry = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
tracing-opentelemetry = { version = "0.32", default-features = false }
prost = "0.14.1"
tonic = { version = "0.14.2", default-features = false, features = ["codegen", "channel", "tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14.2"
tonic-prost-build = { version = "0.14.2", default-features = false }
protox = "0.9.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time", "sync"] }
tracing = "0.1"
tokio-stream = "0.1"
uuid = { version = "1.10", features = ["v7", "fast-rng"] }
memchr = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
