[package]
name = "lumewarp-gateway"
description = "Lumewarp data plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lumewarp"
path = "src/main.rs"

[dependencies]
lumewarp-plugin-host = { path = "../lumewarp-plugin-host" }
lumewarp-config.workspace = true
lumewarp-proto.workspace = true
lumewarp-router-api = { path = "../lumewarp-router-api" }

base64 = "0.22"
anyhow.workspace = true
arc-swap.workspace = true
bytes.workspace = true
clap.workspace = true
http-body-util.workspace = true
httpdate.workspace = true
hyper.workspace = true
hyper-util.workspace = true
hyper-rustls.workspace = true
sha2.workspace = true
ring.workspace = true
hex.workspace = true
fastrand.workspace = true
papaya.workspace = true
prometheus-client.workspace = true
prost.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
tracing-opentelemetry.workspace = true
serde.workspace = true
# T1b: RFC 8785 definition hashes must see the double a JSON number means.
# serde_json rounds twice for 16-17 significant digits without this feature.
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
memchr.workspace = true

[dev-dependencies]
schemars.workspace = true
mock-upstream = { path = "../../../bench/mock-upstream" }
hyper = { workspace = true, features = ["http2"] }
tempfile.workspace = true
tonic = { workspace = true, features = ["server", "router"] }
tonic-prost.workspace = true
