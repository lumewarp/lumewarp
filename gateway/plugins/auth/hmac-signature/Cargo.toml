[package]
name = "lumewarp-plugin-hmac-signature"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
lumewarp-plugin-sdk = { path = "../../../crates/lumewarp-plugin-sdk" }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[profile.release]
lto = true
panic = "abort"
opt-level = "z"
codegen-units = 1

[dev-dependencies]
serde_json = "1"
