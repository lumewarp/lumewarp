# Standalone mode: `lumewarp --config config.example.yaml`
server:
  listen: 0.0.0.0:4000
  admin_listen: 127.0.0.1:9464
  shutdown_grace_ms: 25000
  header_read_timeout_ms: 30000
  body_read_timeout_ms: 30000
  retry_budget_percent: 20
  # Shorthand for keys with no team that may call every model: SHA-256 hex of
  # each client bearer key. With no keys here and no `keys:` section the
  # gateway is open (no client authentication).
  # api_keys: ["0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"]

upstreams:
  - name: vllm-local
    kind: vllm
    base_url: http://localhost:8000/v1
    health_check: {interval_ms: 5000, timeout_ms: 1000}  # url: default vLLM /health
    circuit_breaker: {failure_threshold: 5, open_ms: 30000}
    # Scraped every second by `vllm_load` routers. Empty = base_url minus a
    # trailing /v1, plus /metrics.
    # metrics_url: http://localhost:8000/metrics
  - name: openai
    kind: openai
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY

models:
  - name: llama-vllm
    upstream: vllm-local
    upstream_model: meta-llama/Llama-3.1-8B-Instruct
  - name: gpt-4o-mini
    upstream: openai
    upstream_model: gpt-4o-mini
    # Quoted decimal USD per 1M tokens, converted exactly to nano-USD.
    # Omit `price` when unknown; explicit "0" means free.
    price: { input_usd_per_mtok: "0.15", output_usd_per_mtok: "0.60" }

routers:
  # A model is callable by its own name, one attempt, no retry. A router adds a
  # strategy over weighted members, retries, and fallbacks (always models).
  - name: llama-3.1-8b
    members:
      - {model: llama-vllm}
    retry: {max_attempts: 2, retry_on_status: [429, 502, 503, 504], total_timeout_ms: 30000}
    fallbacks: [gpt-4o-mini]
  # Load-aware routing and a sticky 10% canary (needs a second vLLM model):
  # - name: llama-canary
  #   strategy: vllm_load          # or lowest_latency, weighted, least_in_flight
#   plugin_timeout_ms: 3000      # WASM strategies: one pick may run this long; 0 = 60 s
  #   traffic_split:
  #     - {name: stable, members: [{model: llama-vllm}], weight: 90}
  #     - {name: canary, members: [{model: llama-vllm-next}], weight: 10}
  #   sticky: header               # none | header | team | key
  #   sticky_header: x-session-id

# A second name for a model or a router, one level only. Names are unique across
# models, aliases and routers, and a key's allowed_models lists the names it may
# call: being allowed a name does not allow its target or its members.
aliases:
  - {name: default-llm, target: llama-3.1-8b}

# MCP servers and A2A agents. A client reaches them with its `X-Lumewarp-Key` at
# `/mcp` (aggregated, tools named `<server>__<tool>`), `/mcp/servers/<name>`,
# `/a2a`, `/a2a/<agent>` and `/a2a/<agent>/.well-known/agent-card.json`. The
# gateway authenticates upstream with `auth:` (`none`, `static_bearer` reading
# an env var, `passthrough`, or a loaded upstream-auth plugin) and never sends
# `X-Lumewarp-Key` upstream. What a key may reach is granted on the key below.
# `review_mode` decides which upstream tool and prompt definitions are served:
# `tofu` (default) serves a name it has never seen and withholds a changed
# definition until the control plane approves it, `manual` serves approved
# hashes only, `off` does not check. Each definition's `hash` is the sha256 of
# the canonical definition; with the Admin UI, definitions arrive by themselves.
# mcp_servers:
#   - name: files
#     url: http://localhost:9110/mcp
#     auth: {plugin: static_bearer, secret_env: MCP_FILES_TOKEN}
#     review_mode: tofu
#     timeout_ms: 30000              # one upstream request
#     # auth: {plugin: hmac_signature, params: {skew: 5}, timeout_ms: 2500}
#     #   timeout_ms (WASM plugins) bounds one call; 0 = 60 s.
#     definitions:
#       - {kind: tool, name: echo, hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"}
# a2a_agents:
#   - name: helper
#     url: http://localhost:9120/a2a
#     auth: {plugin: none}
#     # One optional middleware, loaded from LUMEWARP_A2A_MIDDLEWARE_DIR.
#     # middleware: {plugin: strip_artifacts, params: {media_types: [application/x-mock-secret]}, timeout_ms: 1500}

# Teams are the bounded `team` metric label. Their rate limits are shared by
# every key of the team (local to this gateway instance).
teams:
  - id: team-research
    name: Research
    rate_limits: { requests_per_minute: 600, max_parallel_requests: 32 }

# Virtual keys. Uncomment to require keys; any configured key turns auth on.
# keys:
#   - key_id: key-alice
