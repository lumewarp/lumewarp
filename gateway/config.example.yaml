# Standalone mode: `lumewarp --config config.example.yaml`
server:
  listen: 0.0.0.0:4000
  admin_listen: 127.0.0.1:9464
  shutdown_grace_ms: 25000
  header_read_timeout_ms: 30000
  body_read_timeout_ms: 30000
  # Optional SHA-256 hashes of client bearer keys (empty/absent means open access).
  # api_keys: ["0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"]

upstreams:
  - name: vllm-local
    kind: vllm
    base_url: http://localhost:8000/v1
  - name: openai
    kind: openai
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY

deployments:
  - name: llama-vllm
    upstream: vllm-local
    upstream_model: meta-llama/Llama-3.1-8B-Instruct
  - name: gpt-4o-mini
    upstream: openai
    upstream_model: gpt-4o-mini

routes:
  - model: llama-3.1-8b
    deployments: [llama-vllm]
  - model: gpt-4o-mini
    deployments: [gpt-4o-mini]
