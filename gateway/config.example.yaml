# Standalone mode: `lumewarp --config config.example.yaml`
server:
  listen: 0.0.0.0:4000
  admin_listen: 127.0.0.1:9464
  shutdown_grace_ms: 25000
  header_read_timeout_ms: 30000
  body_read_timeout_ms: 30000
  retry_budget_percent: 20
  # Shorthand for keys with no team that may call every model: SHA-256 hex of
  # each client bearer key. With no keys here and no `keys:` section the
  # gateway is open (no client authentication).
  # api_keys: ["0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"]

upstreams:
  - name: vllm-local
    kind: vllm
    base_url: http://localhost:8000/v1
    # Relative to base_url: /v1/models. Use a prefix appropriate for your server.
    health_check: {path: /models, interval_ms: 5000, timeout_ms: 1000}
    circuit_breaker: {failure_threshold: 5, open_ms: 30000}
    # Scraped every second by `vllm_load` routers. Empty = base_url minus a
    # trailing /v1, plus /metrics.
    # metrics_url: http://localhost:8000/metrics
  - name: openai
    kind: openai
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY

models:
  - name: llama-vllm
    upstream: vllm-local
    upstream_model: meta-llama/Llama-3.1-8B-Instruct
  - name: gpt-4o-mini
    upstream: openai
    upstream_model: gpt-4o-mini
    # Quoted decimal USD per 1M tokens, converted exactly to nano-USD.
    # Omit `price` when unknown; explicit "0" means free.
    price: { input_usd_per_mtok: "0.15", output_usd_per_mtok: "0.60" }

routers:
  - name: llama-3.1-8b
    models: [llama-vllm]
    retry: {max_attempts: 2, retry_on_status: [429, 502, 503, 504], total_timeout_ms: 30000}
    fallbacks: [gpt-4o-mini]
  - name: gpt-4o-mini
    models: [gpt-4o-mini]
  # Load-aware routing and a sticky 10% canary (needs a second vLLM model):
  # - name: llama-canary
  #   strategy: vllm_load          # or lowest_latency, weighted, least_in_flight
  #   traffic_split:
  #     - {name: stable, models: [llama-vllm], weight: 90}
  #     - {name: canary, models: [llama-vllm-next], weight: 10}
  #   sticky: header               # none | header | team | key
  #   sticky_header: x-session-id

# Teams are the bounded `team` metric label. Their rate limits are shared by
# every key of the team (local to this gateway instance).
teams:
  - id: team-research
    name: Research
    rate_limits: { requests_per_minute: 600, max_parallel_requests: 32 }

