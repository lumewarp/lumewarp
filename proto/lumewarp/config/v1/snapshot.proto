syntax = "proto3";

package lumewarp.config.v1;

// A fully resolved, immutable config snapshot. The control plane's config
// compiler expands inheritance before emitting it; the gateway never resolves
// anything at request time. Standalone YAML mode uses the same schema.
message Snapshot {
  // Monotonically increasing. Rollback = re-push an older snapshot under a
  // new version.
  uint64 version = 1;
  repeated Upstream upstreams = 2;
  repeated Model models = 3;
  repeated Router routers = 4;
  // Virtual API keys with their already-resolved effective policy.
  repeated ApiKey api_keys = 5;
  // Teams referenced by api_keys; source of the bounded `team` metric label.
  repeated Team teams = 6;
  int64 created_at_unix_ms = 7;
  // Features the gateway must understand to apply this snapshot. A gateway
  // NACKs (UNSUPPORTED_FEATURE) any snapshot naming a capability it lacks.
  repeated string required_capabilities = 8;
  // Identifies the control-plane installation; a gateway never boots from an
  // on-disk snapshot whose scope differs from the one it is configured for.
  string scope = 9;
  // Other callable names. Models, aliases and routers share one name space.
  repeated Alias aliases = 10;
  // Upstream MCP servers. Capability "mcp".
  repeated McpServer mcp_servers = 11;
  // Upstream A2A agents. Capability "a2a".
  repeated A2aAgent a2a_agents = 12;
}

// An OpenAI-compatible endpoint (vLLM, OpenAI, or anything speaking the API).
message Upstream {
  string name = 1;
  UpstreamKind kind = 2;
  // e.g. "http://vllm-0:8000/v1"
  string base_url = 3;
  // Name of an env var / secret holding the bearer token; never the value.
  string api_key_ref = 4;
  uint32 timeout_ms = 5;
  StreamUsageMode stream_usage_mode = 6;
  // Active health probe of this upstream. Absent = no probing (passive
  // failures still feed the circuit breaker). Capability "health_check".
  HealthCheck health_check = 7;
  // Per-model circuit breaker for models on this upstream. Absent =
  // never opens. Capability "circuit_breaker".
  CircuitBreaker circuit_breaker = 8;
  // Prometheus endpoint scraped for load by the "vllm_load" strategy.
  // Empty = base_url with a trailing "/v1" removed, plus "/metrics".
  string metrics_url = 9;
  // Bearer token sealed by the control plane: 0x01 || 12-byte nonce || AES-256-GCM
  // ciphertext and tag, key = HKDF-SHA256(LUMEWARP_ENCRYPTION_KEY, no salt, info
  // "lumewarp/upstream-api-key/v1"), no AAD. The gateway opens it when applying the
  // snapshot, never per request. At most one of this and api_key_ref is set.
  // Capability "encrypted_api_key".
  bytes api_key_ciphertext = 10;
}

// GET <url> every interval; 2xx within timeout = success.
message HealthCheck {
  // Absolute http(s) URL without userinfo. Empty = base_url with trailing
  // slashes stripped plus "/models". The upstream's bearer token is sent only to
  // base_url's origin (scheme, host and port).
  string url = 1;
  uint32 interval_ms = 2;
  uint32 timeout_ms = 3;
  // Consecutive failures before the upstream is marked unhealthy (0 = 3).
  uint32 unhealthy_threshold = 4;
  // Consecutive successes before it is healthy again (0 = 1).
  uint32 healthy_threshold = 5;
}

// Opens after `failure_threshold` consecutive retryable failures (connect
// error, timeout, 5xx/429 that would be retried); while open the model is
// skipped; after `open_ms` one trial request is let through (half-open) and its
// outcome closes or re-opens the breaker.
message CircuitBreaker {
  // 0 = 5.
  uint32 failure_threshold = 1;
  // 0 = 30000.
  uint32 open_ms = 2;
}

// How the gateway obtains token usage for streamed responses.
enum StreamUsageMode {
  // Treated as INCLUDE_USAGE.
  STREAM_USAGE_MODE_UNSPECIFIED = 0;
  // Force stream_options.include_usage upstream; strip the usage-only event
  // again if the client did not ask for it.
  STREAM_USAGE_MODE_INCLUDE_USAGE = 1;
  // Upstream does not support include_usage: forward untouched; streamed
  // usage is reported as MISSING unless the client requested it.
  STREAM_USAGE_MODE_PASSTHROUGH = 2;
}

enum UpstreamKind {
  UPSTREAM_KIND_UNSPECIFIED = 0;
  UPSTREAM_KIND_OPENAI = 1;
  UPSTREAM_KIND_VLLM = 2;
  UPSTREAM_KIND_OPENAI_COMPATIBLE = 3;
}

// A callable name mapped to one model on one upstream. Calling it directly is
// a single attempt: retries, fallbacks, splits and strategies live on routers.
message Model {
  reserved 4;
  reserved "weight";
  string name = 1;
  string upstream = 2;
  // Model name sent upstream (may differ from the public name).
  string upstream_model = 3;
  // Price used to compute spend from upstream-reported usage. Absent = price
  // unknown: usage is still metered but cost is reported as unknown, never 0.
  Price price = 5;
  // Upper bound for the request's max_tokens and max_completion_tokens (after
  // default_body and reasoning are applied); above it the attempt is answered
  // 400 without reaching the upstream. 0 = no bound. Capability "model_limits".
  uint32 max_output_tokens = 6;
  // A JSON object merged under the request body: a key the client sends wins,
  // objects present on both sides are merged recursively, anything else is
  // the client's. Never contains model, stream or stream_options. Empty = none.
  // Capability "default_body".
  string default_body_json = 7;
  // How the OpenAI `reasoning_effort` field is handled. Absent = passed
  // through untouched. Capability "reasoning_effort".
  ReasoningEffort reasoning_effort = 8;
  // Periodic chat completion ("1 + 1 = ?") sent through this model's own body
  // rules to <upstream base_url>/chat/completions; while it fails the model gets
  // no traffic (on top of its upstream's health check). Absent = not probed.
  // Probes are not metered. Capability "model_chat_check".
  ChatCheck chat_check = 9;
}

// Same timing rules as HealthCheck: interval at least 1000 ms, timeout above 0
// and below the interval. A 2xx answer within the timeout is a success.
message ChatCheck {
  uint32 interval_ms = 1;
  uint32 timeout_ms = 2;
  // Consecutive failures before the model is marked unhealthy (0 = 3).
  uint32 unhealthy_threshold = 3;
  // Consecutive successes before it is healthy again (0 = 1).
  uint32 healthy_threshold = 4;
}

// Request bodies are only re-encoded for a model with default_body_json or
// reasoning_effort; top-level values the gateway does not change keep their
// exact bytes.
message ReasoningEffort {
  ReasoningEffortMode mode = 1;
  // MAPPED: level -> JSON object merged into the request in place of
  // reasoning_effort, above default_body and below the client's own fields.
  // A level without an entry is answered 400.
  map<string, string> fragments_json = 2;
  // The level used when the client sends no reasoning_effort (or null).
  // Empty = none.
  string default_level = 3;
}

enum ReasoningEffortMode {
  // Treated as PASSTHROUGH.
  REASONING_EFFORT_MODE_UNSPECIFIED = 0;
  // Forward reasoning_effort as sent (default_level is added when absent).
  REASONING_EFFORT_MODE_PASSTHROUGH = 1;
  // Remove reasoning_effort: the model has no reasoning control.
  REASONING_EFFORT_MODE_STRIP = 2;
  // Replace reasoning_effort with fragments_json[level].
  REASONING_EFFORT_MODE_MAPPED = 3;
}

// Fixed-point: nano-USD (1e-9 USD) per one million tokens. An explicit
// all-zero Price means free.
message Price {
  uint64 input_nano_usd_per_mtok = 1;
  uint64 output_nano_usd_per_mtok = 2;
}

// Another callable name for a model or a router (never another alias). It is
// authorized on its own name and shares the target's pool at run time.
message Alias {
  string name = 1;
  // Name of a Model or a Router in this snapshot.
  string target = 2;
}

// One model of a router (or of a traffic split), with this router's settings.
message RouterMember {
  // Name of a Model in this snapshot.
  string model = 1;
  // Relative share for the "weighted" strategy; independent per router.
  uint32 weight = 2;
  // Strategy-specific member settings: a JSON object, at most 16 KiB UTF-8.
  // Empty means {}.
  string params_json = 3;
}

// A callable name that distributes requests over models.
message Router {
  reserved 2, 3, 9, 10;
  reserved "models", "custom_strategy", "strategy_params_json";
  string name = 1;
  // Ignored when traffic_split is non-empty.
  repeated RouterMember members = 11;
  // Compiled-in strategy name, built-ins included: "weighted",
  // "least_in_flight", "lowest_latency" (EWMA of time to response headers per
  // model), "vllm_load" (power of two choices on num_requests_waiting, then
  // kv_cache_usage_perc, scraped every second; in-flight when stale), or a
  // registered custom strategy. Required capability: "strategy:<name>". A
  // gateway without it NACKs UNSUPPORTED_FEATURE.
  string strategy = 12;
  // Strategy settings: a JSON object, at most 16 KiB UTF-8. Empty means {}.
  string params_json = 13;
  // Absent = a single attempt. Capability "retry".
  RetryPolicy retry = 4;
  // Names of Models tried in order once every attempt on this router has
  // failed retryably (before any response byte reached the client). They use
  // this router's retry budget. Capability "fallbacks".
  repeated string fallbacks = 5;
  // Percentage split between groups of models (canary). A request first
  // picks a split by weight (sticky when `sticky` is set), then a model
  // inside it with `strategy`. Retries stay inside the chosen split, then fall
  // back to the other splits. Capability "traffic_split".
  repeated TrafficSplit traffic_split = 6;
  StickyBy sticky = 7;
  // Request header hashed when sticky = STICKY_BY_HEADER.
  string sticky_header = 8;
}

// Retries happen only before any response byte is sent to the client: on
// connect errors, upstream timeouts and the statuses below (for streams: only
// before the upstream answered with headers). A retry picks another
// model of the same router when one is available.
message RetryPolicy {
  // Total attempts including the first; 0 = 2.
  uint32 max_attempts = 1;
  // Empty = 429, 502, 503, 504.
  repeated uint32 retry_on_status = 2;
  // Upper bound for all attempts together; 0 = no bound beyond each
  // upstream's timeout_ms.
  uint32 total_timeout_ms = 3;
}

message TrafficSplit {
  reserved 2;
  reserved "models";
  // Bounded label value for metrics (e.g. "stable", "canary").
  string name = 1;
  // Relative weight; the split's share is weight / sum(weights).
  uint32 weight = 3;
  repeated RouterMember members = 4;
}

enum StickyBy {
  STICKY_BY_NONE = 0;
  // Hash of the sticky_header value; requests without it are not sticky.
  STICKY_BY_HEADER = 1;
  STICKY_BY_TEAM = 2;
  STICKY_BY_KEY = 3;
}

message Team {
  string id = 1;
  string name = 2;
  reserved 3, 4;
  reserved "org_id", "org_name";
}

// A virtual key. The gateway only ever sees the hash. Every key belongs to one
// team and is owned by a member of that team or by one of its service
// accounts; the owner only matters to the control plane (budgets, rate-limit
// scopes and usage attribution are compiled into `policy`).
message ApiKey {
  // Public, non-secret identifier (e.g. "key_01J…"); delta removals use it.
  string key_id = 1;
  // sha256 of the full secret key, 32 bytes.
  bytes key_hash = 2;
  reserved 3, 5;
  reserved "org_id", "project_id";
  string team_id = 4;
  KeyStatus status = 6;
  // 0 = never expires.
  int64 expires_at_unix_ms = 7;
  // Team policy narrowed by the owner's (member or service account) policy,
  // resolved by the compiler.
  EffectivePolicy policy = 8;
  // Previous secret kept valid during the control plane's rotation grace period.
  // Empty = no grace. The gateway accepts it as the same key (same key_id) until
  // previous_key_expires_at_unix_ms, and never past expires_at_unix_ms. Because the
  // old hash carries its own expiry, a gateway booting from its persisted snapshot
  // keeps enforcing it while the control plane is unreachable. Capability
  // "rotation_grace" is required when this is nonempty.
  bytes previous_key_hash = 9;
  // Unix ms after which previous_key_hash is rejected. Must be > 0 when the hash is
  // set; the compiler drops an expired pair on its next compile so the delta removes
  // it from every gateway.
  int64 previous_key_expires_at_unix_ms = 10;
}

enum KeyStatus {
  KEY_STATUS_UNSPECIFIED = 0;
  KEY_STATUS_ACTIVE = 1;
  KEY_STATUS_REVOKED = 2;
  // Hard budget of the team or of the key's owner reached; decided by the control
  // plane from usage events and pushed as a delta.
  KEY_STATUS_BUDGET_EXCEEDED = 3;
  KEY_STATUS_SUSPENDED = 4;
}

message EffectivePolicy {
  // When true every name is allowed and allowed_models is ignored.
  bool allow_all_models = 1;
  // Names (of any kind) this key may call when allow_all_models is false,
  // expanded by the compiler to their current spelling.
  // Empty with allow_all_models=false means deny-all.
  repeated string allowed_models = 2;
  // One entry per level that sets a limit (team, then the key's owner),
  // already resolved by the compiler. Each scope id names one shared limiter:
  // every key under the same team draws from the same team bucket, and every
  // key of the same owner from the same owner bucket.
  repeated RateLimitScope rate_limit_scopes = 3;
  // End of the budget window that produced KEY_STATUS_BUDGET_EXCEEDED, for
  // diagnostics only; the gateway never unblocks a key on its own.
  int64 budget_window_end_unix_ms = 4;
  // When true every MCP server and tool is allowed and mcp_grants is ignored.
  bool allow_all_mcp = 5;
  // MCP servers (and tools on them) this key may see and call, already
  // intersected along org -> team -> owner -> key by the compiler. A server
  // absent here is invisible. Empty with allow_all_mcp=false means deny-all.
  repeated McpGrant mcp_grants = 6;
  // When true every A2A agent is allowed and allowed_agents is ignored.
  bool allow_all_agents = 7;
  // Names of A2A agents this key may call. Empty with allow_all_agents=false
  // means deny-all.
  repeated string allowed_agents = 8;
}

message McpGrant {
  // McpServer.name.
  string server = 1;
  // When true every approved tool of the server is allowed and tools is
  // ignored. Prompts of a granted server are always allowed.
  bool all_tools = 2;
  // Upstream tool names (without the "<server>__" prefix).
  repeated string tools = 3;
}

// A plugin chosen for one upstream, with its settings.
message PluginRef {
  // Built-in name or the name a loaded WASM plugin declares in its manifest.
  string plugin = 1;
  // Plugin settings: a JSON object, at most 16 KiB UTF-8. Empty means {}.
  // Never contains secrets (see docs/plugins.md).
  string params_json = 2;
}

// How the gateway authenticates to an MCP server or A2A agent. Required
// capability "auth:<plugin>". Built-ins: "none", "static_bearer",
// "passthrough" (forward the client's Authorization header unchanged).
// Anything else is a WASM upstream-auth plugin.
message UpstreamAuth {
  PluginRef plugin = 1;
  // static_bearer only: env var holding the token. At most one of this and
  // secret_ciphertext is set.
  string secret_ref = 2;
  // static_bearer only: token sealed like Upstream.api_key_ciphertext, HKDF
  // info "lumewarp/upstream-auth-secret/v1". Opened when the snapshot is
  // applied, never per request.
  bytes secret_ciphertext = 3;
}

enum McpReviewMode {
  MCP_REVIEW_MODE_UNSPECIFIED = 0;
  // A tool or prompt name seen for the first time is approved automatically
  // (and reported); a changed definition of a known name is withheld until
  // approved.
  MCP_REVIEW_MODE_TOFU = 1;
  // Every definition not in `approved` is withheld until approved.
  MCP_REVIEW_MODE_MANUAL = 2;
  // Definitions are not checked.
  MCP_REVIEW_MODE_OFF = 3;
}

enum McpDefinitionKind {
  MCP_DEFINITION_KIND_UNSPECIFIED = 0;
  MCP_DEFINITION_KIND_TOOL = 1;
  MCP_DEFINITION_KIND_PROMPT = 2;
}

// One approved definition. The gateway filters upstream list responses by
// these hashes; it never serves a definition from the snapshot.
message McpDefinition {
  McpDefinitionKind kind = 1;
  // Upstream name, without prefix.
  string name = 2;
  // sha256 of the canonical definition, 32 bytes (docs/plugins.md, "Definition
  // hash").
  bytes hash = 3;
}

message McpServer {
  // Stable id; usage and reports carry the name.
  string id = 1;
  // ^[a-z][a-z0-9_-]{0,62}$ and unique among MCP servers. Prefixes tool names
  // on the aggregated endpoint as "<name>__<tool>".
  string name = 2;
  // Streamable HTTP endpoint, absolute http(s) URL without userinfo.
  string url = 3;
  UpstreamAuth auth = 4;
  // Per upstream request; 0 = gateway default.
  uint32 timeout_ms = 5;
  McpReviewMode review_mode = 6;
  repeated McpDefinition approved = 7;
}

message A2aAgent {
  string id = 1;
  // ^[a-z][a-z0-9_-]{0,62}$ and unique among A2A agents.
  string name = 2;
  // JSON-RPC endpoint of the upstream agent, absolute http(s) URL.
  string url = 3;
  // Agent Card URL. Empty = origin of `url` + "/.well-known/agent-card.json".
  string card_url = 4;
  UpstreamAuth auth = 5;
  // Optional, at most one. Required capability "a2a_middleware:<plugin>".
  PluginRef middleware = 6;
  uint32 timeout_ms = 7;
  // Card served when the gateway has not fetched one itself (an
  // administrator pasted it, or the last one reported). JSON, at most 64 KiB.
  string card_json = 8;
}

message RateLimitScope {
  // Stable id: "team:<uuid>", "member:<uuid>" (one per team member, see the
  // control plane) or "sa:<uuid>". Limiter state survives snapshot swaps
  // keyed by this id.
  string id = 1;
  RateLimit limit = 2;
}

// Enforced per gateway instance (N gateways => up to N x the limit).
// Zero = unlimited for that dimension. tokens_per_minute is retrospective:
// it rejects later requests once usage has been charged.
message RateLimit {
  uint32 requests_per_minute = 1;
  uint64 tokens_per_minute = 2;
  uint32 max_parallel_requests = 3;
}
