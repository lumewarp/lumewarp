syntax = "proto3";

package lumewarp.config.v1;

// A fully resolved, immutable config snapshot. The control plane's config
// compiler expands inheritance before emitting it; the gateway never resolves
// anything at request time. Standalone YAML mode uses the same schema.
message Snapshot {
  // Monotonically increasing. Rollback = re-push an older snapshot under a
  // new version.
  uint64 version = 1;
  repeated Upstream upstreams = 2;
  repeated Deployment deployments = 3;
  repeated ModelRoute routes = 4;
  // Virtual API keys with their already-resolved effective policy.
  repeated ApiKey api_keys = 5;
  // Teams referenced by api_keys; source of the bounded `team` metric label.
  repeated Team teams = 6;
  int64 created_at_unix_ms = 7;
  // Features the gateway must understand to apply this snapshot. A gateway
  // NACKs (UNSUPPORTED_FEATURE) any snapshot naming a capability it lacks.
  repeated string required_capabilities = 8;
  // Identifies the control-plane installation; a gateway never boots from an
  // on-disk snapshot whose scope differs from the one it is configured for.
  string scope = 9;
}

// An OpenAI-compatible endpoint (vLLM, OpenAI, or anything speaking the API).
message Upstream {
  string name = 1;
  UpstreamKind kind = 2;
  // e.g. "http://vllm-0:8000/v1"
  string base_url = 3;
  // Name of an env var / secret holding the bearer token; never the value.
  string api_key_ref = 4;
  uint32 timeout_ms = 5;
  StreamUsageMode stream_usage_mode = 6;
  // Active health probe of this upstream. Absent = no probing (passive
  // failures still feed the circuit breaker). Capability "health_check".
  HealthCheck health_check = 7;
  // Per-deployment circuit breaker for deployments on this upstream. Absent =
  // never opens. Capability "circuit_breaker".
  CircuitBreaker circuit_breaker = 8;
  // Prometheus endpoint scraped for load by ROUTING_STRATEGY_VLLM_LOAD.
  // Empty = base_url with a trailing "/v1" removed, plus "/metrics".
  string metrics_url = 9;
}

// GET <base_url><path> every interval; 2xx within timeout = success.
message HealthCheck {
  // Relative to base_url; empty = "/models".
  string path = 1;
  uint32 interval_ms = 2;
  uint32 timeout_ms = 3;
  // Consecutive failures before the upstream is marked unhealthy (0 = 3).
  uint32 unhealthy_threshold = 4;
  // Consecutive successes before it is healthy again (0 = 1).
  uint32 healthy_threshold = 5;
}

// Opens after `failure_threshold` consecutive retryable failures (connect
// error, timeout, 5xx/429 that would be retried); while open the deployment is
// skipped; after `open_ms` one trial request is let through (half-open) and its
// outcome closes or re-opens the breaker.
message CircuitBreaker {
  // 0 = 5.
  uint32 failure_threshold = 1;
  // 0 = 30000.
  uint32 open_ms = 2;
}

// How the gateway obtains token usage for streamed responses.
enum StreamUsageMode {
  // Treated as INCLUDE_USAGE.
  STREAM_USAGE_MODE_UNSPECIFIED = 0;
  // Force stream_options.include_usage upstream; strip the usage-only event
  // again if the client did not ask for it.
  STREAM_USAGE_MODE_INCLUDE_USAGE = 1;
  // Upstream does not support include_usage: forward untouched; streamed
  // usage is reported as MISSING unless the client requested it.
  STREAM_USAGE_MODE_PASSTHROUGH = 2;
}

enum UpstreamKind {
  UPSTREAM_KIND_UNSPECIFIED = 0;
  UPSTREAM_KIND_OPENAI = 1;
  UPSTREAM_KIND_VLLM = 2;
  UPSTREAM_KIND_OPENAI_COMPATIBLE = 3;
}

// A concrete model served by one upstream.
message Deployment {
  string name = 1;
  string upstream = 2;
  // Model name sent upstream (may differ from the public alias).
  string upstream_model = 3;
  uint32 weight = 4;
  // Price used to compute spend from upstream-reported usage. Absent = price
  // unknown: usage is still metered but cost is reported as unknown, never 0.
  Price price = 5;
}

// Fixed-point: nano-USD (1e-9 USD) per one million tokens. An explicit
// all-zero Price means free.
message Price {
  uint64 input_nano_usd_per_mtok = 1;
  uint64 output_nano_usd_per_mtok = 2;
}

// Public model alias -> deployments.
message ModelRoute {
  string model = 1;
  // Ignored when traffic_split is non-empty.
  repeated string deployments = 2;
  RoutingStrategy strategy = 3;
  // Absent = a single attempt. Capability "retry".
  RetryPolicy retry = 4;
  // Other route aliases tried in order once every attempt on this route has
  // failed retryably (before any response byte reached the client). Each
  // fallback is tried with its own deployments and strategy but this route's
  // retry budget; fallbacks of fallbacks are not followed. The client-visible
  // model name is unchanged. Capability "fallbacks".
  repeated string fallbacks = 5;
  // Percentage split between groups of deployments (canary). A request first
  // picks a split by weight (sticky when `sticky` is set), then a deployment
  // inside it with `strategy`. Retries stay inside the chosen split, then fall
  // back to the other splits. Capability "traffic_split".
  repeated TrafficSplit traffic_split = 6;
  StickyBy sticky = 7;
  // Request header hashed when sticky = STICKY_BY_HEADER.
  string sticky_header = 8;
}

enum RoutingStrategy {
  ROUTING_STRATEGY_UNSPECIFIED = 0;
  ROUTING_STRATEGY_WEIGHTED = 1;
  ROUTING_STRATEGY_LEAST_IN_FLIGHT = 2;
  // EWMA of time to response headers per deployment. Capability
  // "lowest_latency".
  ROUTING_STRATEGY_LOWEST_LATENCY = 3;
  // Power of two choices on vLLM load (num_requests_waiting, then
  // kv_cache_usage_perc) scraped every second; falls back to in-flight when a
  // deployment's metrics are stale. Capability "vllm_load".
  ROUTING_STRATEGY_VLLM_LOAD = 4;
}

// Retries happen only before any response byte is sent to the client: on
// connect errors, upstream timeouts and the statuses below (for streams: only
// before the upstream answered with headers). A retry picks another
// deployment of the same route when one is available.
message RetryPolicy {
  // Total attempts including the first; 0 = 2.
  uint32 max_attempts = 1;
  // Empty = 429, 502, 503, 504.
  repeated uint32 retry_on_status = 2;
  // Upper bound for all attempts together; 0 = no bound beyond each
  // upstream's timeout_ms.
  uint32 total_timeout_ms = 3;
}

message TrafficSplit {
  // Bounded label value for metrics (e.g. "stable", "canary").
  string name = 1;
  repeated string deployments = 2;
  // Relative weight; the split's share is weight / sum(weights).
  uint32 weight = 3;
}

enum StickyBy {
  STICKY_BY_NONE = 0;
  // Hash of the sticky_header value; requests without it are not sticky.
  STICKY_BY_HEADER = 1;
  STICKY_BY_TEAM = 2;
  STICKY_BY_KEY = 3;
}

message Team {
  string id = 1;
  string name = 2;
  reserved 3, 4;
  reserved "org_id", "org_name";
}

// A virtual key. The gateway only ever sees the hash. Every key belongs to one
// team and is owned by a member of that team or by one of its service
// accounts; the owner only matters to the control plane (budgets, rate-limit
// scopes and usage attribution are compiled into `policy`).
message ApiKey {
  // Public, non-secret identifier (e.g. "key_01J…"); delta removals use it.
  string key_id = 1;
  // sha256 of the full secret key, 32 bytes.
  bytes key_hash = 2;
  reserved 3, 5;
  reserved "org_id", "project_id";
  string team_id = 4;
  KeyStatus status = 6;
  // 0 = never expires.
  int64 expires_at_unix_ms = 7;
  // Team policy narrowed by the owner's (member or service account) policy,
  // resolved by the compiler.
  EffectivePolicy policy = 8;
}

enum KeyStatus {
  KEY_STATUS_UNSPECIFIED = 0;
  KEY_STATUS_ACTIVE = 1;
  KEY_STATUS_REVOKED = 2;
  // Hard budget of the team or of the key's owner reached; decided by the control
  // plane from usage events and pushed as a delta.
  KEY_STATUS_BUDGET_EXCEEDED = 3;
  KEY_STATUS_SUSPENDED = 4;
}

message EffectivePolicy {
  // When true every route is allowed and allowed_models is ignored.
  bool allow_all_models = 1;
  // Public model aliases this key may call when allow_all_models is false.
  // Empty with allow_all_models=false means deny-all.
  repeated string allowed_models = 2;
  // One entry per level that sets a limit (team, then the key's owner),
  // already resolved by the compiler. Each scope id names one shared limiter:
  // every key under the same team draws from the same team bucket, and every
  // key of the same owner from the same owner bucket.
  repeated RateLimitScope rate_limit_scopes = 3;
  // End of the budget window that produced KEY_STATUS_BUDGET_EXCEEDED, for
  // diagnostics only; the gateway never unblocks a key on its own.
  int64 budget_window_end_unix_ms = 4;
}

message RateLimitScope {
  // Stable id: "team:<uuid>", "member:<uuid>" (one per team member, see the
  // control plane) or "sa:<uuid>". Limiter state survives snapshot swaps
  // keyed by this id.
  string id = 1;
  RateLimit limit = 2;
}

// Enforced per gateway instance in P1 (N gateways => up to N x the limit).
// Zero = unlimited for that dimension. tokens_per_minute is retrospective:
// it rejects later requests once usage has been charged.
message RateLimit {
  uint32 requests_per_minute = 1;
  uint64 tokens_per_minute = 2;
  uint32 max_parallel_requests = 3;
}
