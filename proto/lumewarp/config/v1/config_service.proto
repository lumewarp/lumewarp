syntax = "proto3";

package lumewarp.config.v1;

import "lumewarp/config/v1/snapshot.proto";

// Control plane -> gateway config stream. The gateway opens the stream and
// sends Hello; the control plane answers with a full snapshot, or a delta
// whose base_version == Hello.have_version when it still retains that base.
// At most one update per stream is un-ACKed at a time. ACK means the version
// is validated, durably persisted and active. See docs/config-protocol.md.
// The gateway authenticates with `authorization: Bearer <gateway token>`
// metadata; the token is bound to a gateway id and scope by the control plane.
service ConfigService {
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc Stream(stream GatewayMessage) returns (stream ConfigUpdate);
}

message GatewayMessage {
  oneof msg {
    Hello hello = 1;
    Ack ack = 2;
    Nack nack = 3;
    // Any time after Hello; not a reply to an update.
    HealthReport health = 4;
    // Any time after Hello; not a reply to an update.
    CatalogReport catalog = 5;
  }
}

// Probe state of every upstream with a health check and every model with a chat
// check in the active snapshot. Sent after an ACK and whenever a probe changes
// state (coalesced, at most once a second). Each report replaces the previous
// one; anything not probed is absent. Display only: routing never depends on
// the control plane.
message HealthReport {
  repeated TargetHealth upstreams = 1;
  repeated TargetHealth models = 2;
}

message TargetHealth {
  string name = 1;
  bool healthy = 2;
}

message Hello {
  string gateway_id = 1;
  // Version of the snapshot persisted on disk, 0 if none. The control plane
  // sends a full snapshot unless it can send a delta from this version.
  uint64 have_version = 2;
  // Diagnostic only.
  string gateway_version = 3;
  repeated string supported_capabilities = 4;
  // Scope of the on-disk snapshot, empty if none.
  string scope = 5;
  // ConfigUpdate.target_digest of the on-disk snapshot (empty if none). The
  // control plane sends a delta only if this equals the digest it stored for
  // have_version; otherwise (e.g. after a control-plane restore) a full.
  bytes have_digest = 6;
  reserved 7;
  reserved "strategies";
  // Every plugin this gateway has: built-ins and the WASM plugins loaded from
  // its plugin directories at startup (docs/plugins.md). New plugins need no
  // change here, in the control plane or in the UI.
  repeated PluginDescriptor plugins = 8;
  // WASM plugin ABI (WIT package major version) this gateway hosts.
  uint32 plugin_abi = 9;
}

enum PluginKind {
  PLUGIN_KIND_UNSPECIFIED = 0;
  // Capability "strategy:<name>"; used by Router.strategy.
  PLUGIN_KIND_ROUTER_STRATEGY = 1;
  // Capability "auth:<name>"; used by UpstreamAuth.plugin.
  PLUGIN_KIND_UPSTREAM_AUTH = 2;
  // Capability "a2a_middleware:<name>"; used by A2aAgent.middleware.
  PLUGIN_KIND_A2A_MIDDLEWARE = 3;
}

// Declared by a plugin's manifest (or by the gateway for a built-in). The
// control plane treats all of it as untrusted data.
message PluginDescriptor {
  PluginKind kind = 1;
  // ^[a-z][a-z0-9_]{0,62}$, unique per kind; the capability suffix.
  string name = 2;
  string title = 3;
  string description = 4;
  // True for plugins compiled into the gateway.
  bool builtin = 5;
  // JSON Schema of PluginRef.params_json (Router.params_json for a router
  // strategy), at most 16 KiB UTF-8. Larger ones are ignored and the params
  // cannot be validated before the gateway's configure.
  string params_schema_json = 6;
  // Router strategies only.
  RouterStrategyInfo router = 7;
  // sha256 of the .wasm file, hex; empty for built-ins. Diagnostic only.
  string wasm_sha256 = 8;
  // Changes whenever any field above does.
  string digest = 9;
}

message RouterStrategyInfo {
  // False: member weights have no effect and the UI hides them.
  bool uses_weight = 1;
  // Gateway-provided signals the strategy reads: "latency", "vllm_load".
  repeated string needs = 2;
  // JSON Schema of RouterMember.params_json, at most 16 KiB UTF-8.
  string member_schema_json = 3;
}

// What the gateway observed upstream that the control plane cannot fetch
// itself (it cannot run WASM auth plugins or hold users' tokens). Untrusted
// data: bounded by the gateway (docs/plugins.md, "Catalog reports") and shown
// only as text. Each report adds to what was reported before.
message CatalogReport {
  repeated ObservedDefinition definitions = 1;
  repeated AgentCardReport cards = 2;
}

message ObservedDefinition {
  // McpServer.name.
  string server = 1;
  McpDefinitionKind kind = 2;
  string name = 3;
  // sha256 of the canonical definition, 32 bytes.
  bytes hash = 4;
  // The canonical definition JSON, at most 64 KiB.
  string definition_json = 5;
  // True when the gateway already serves it (TOFU first sight). The control
  // plane approves it only if the name is new to it there too (the first report
  // wins); otherwise it is pending. False: withheld, pending review.
  bool auto_approved = 6;
  int64 observed_at_unix_ms = 7;
  // McpServer.id. A report whose id no longer matches `server` is discarded.
  string server_id = 8;
  // Snapshot version the gateway was serving when it observed this.
  uint64 config_version = 9;
}

message AgentCardReport {
  // A2aAgent.name.
  string agent = 1;
  // The card as the gateway serves it (rewritten), at most 64 KiB; empty when no card is available.
  string card_json = 2;
  // Sanitized fetch error, empty on success.
  string error = 3;
  int64 fetched_at_unix_ms = 4;
  // A2aAgent.id. A report whose id no longer matches `agent` is discarded.
  string agent_id = 5;
  // Snapshot version the gateway was serving when it fetched this.
  uint64 config_version = 6;
}

message Ack {
  uint64 version = 1;
}

message Nack {
  uint64 version = 1;
  // Sanitized, never contains secrets.
  string reason = 2;
  // Version the gateway is actually running.
  uint64 have_version = 3;
  NackCode code = 4;
}

enum NackCode {
  NACK_CODE_UNSPECIFIED = 0;
  // Delta base != gateway's version; control plane answers with a full.
  NACK_CODE_BASE_MISMATCH = 1;
  // Snapshot failed validation; control plane must not resend the same
  // version (quarantine it) until a newer version exists.
  NACK_CODE_INVALID_CONFIG = 2;
  NACK_CODE_UNSUPPORTED_FEATURE = 3;
  // Could not persist to disk; control plane may retry with backoff.
  NACK_CODE_PERSIST_FAILED = 4;
}

message ConfigUpdate {
  oneof update {
    Snapshot full = 1;
    Delta delta = 2;
  }
  // Control plane's digest of the resulting snapshot version (opaque to the
  // gateway: stored next to the snapshot and echoed in Hello.have_digest).
  bytes target_digest = 3;
}

// Applies on top of base_version to produce version. A gateway whose current
// version != base_version NACKs it, and the control plane answers with a full
// snapshot.
message Delta {
  uint64 base_version = 1;
  uint64 version = 2;
  repeated Upstream upsert_upstreams = 3;
  repeated string remove_upstreams = 4;
  repeated Model upsert_models = 5;
  repeated string remove_models = 6;
  repeated Router upsert_routers = 7;
  repeated string remove_routers = 8;
  repeated ApiKey upsert_api_keys = 9;
  // key_id values.
  repeated string remove_api_keys = 10;
  repeated Team upsert_teams = 11;
  repeated string remove_teams = 12;
  // Target snapshot metadata, replaced wholesale.
  int64 created_at_unix_ms = 13;
  repeated string required_capabilities = 14;
  repeated Alias upsert_aliases = 15;
  repeated string remove_aliases = 16;
  // Keyed by name.
  repeated McpServer upsert_mcp_servers = 17;
  repeated string remove_mcp_servers = 18;
  repeated A2aAgent upsert_a2a_agents = 19;
  repeated string remove_a2a_agents = 20;
}
