syntax = "proto3";

package lumewarp.config.v1;

import "lumewarp/config/v1/snapshot.proto";

// Control plane -> gateway config stream. The gateway opens the stream and
// sends Hello; the control plane answers with a full snapshot, or a delta
// whose base_version == Hello.have_version when it still retains that base.
// At most one update per stream is un-ACKed at a time. ACK means the version
// is validated, durably persisted and active. See docs/config-protocol.md.
// The gateway authenticates with `authorization: Bearer <gateway token>`
// metadata; the token is bound to a gateway id and scope by the control plane.
service ConfigService {
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc Stream(stream GatewayMessage) returns (stream ConfigUpdate);
}

message GatewayMessage {
  oneof msg {
    Hello hello = 1;
    Ack ack = 2;
    Nack nack = 3;
  }
}

message Hello {
  string gateway_id = 1;
  // Version of the snapshot persisted on disk, 0 if none. The control plane
  // sends a full snapshot unless it can send a delta from this version.
  uint64 have_version = 2;
  // Diagnostic only.
  string gateway_version = 3;
  repeated string supported_capabilities = 4;
  // Scope of the on-disk snapshot, empty if none.
  string scope = 5;
  // ConfigUpdate.target_digest of the on-disk snapshot (empty if none). The
  // control plane sends a delta only if this equals the digest it stored for
  // have_version; otherwise (e.g. after a control-plane restore) a full.
  bytes have_digest = 6;
  // Every strategy compiled into this gateway. New strategies need no change
  // here, in the control plane or in the UI.
  repeated StrategyDescriptor strategies = 7;
}

// Declared by a strategy crate with `register!` (docs/router-strategies.md).
// The control plane treats all of it as untrusted data.
message StrategyDescriptor {
  // Same name as the "strategy:<name>" capability.
  string name = 1;
  string title = 2;
  string description = 3;
  // False: member weights have no effect and the UI hides them.
  bool uses_weight = 4;
  // Gateway-provided signals the strategy reads: "latency", "vllm_load".
  repeated string needs = 5;
  // JSON Schema of Router.params_json, at most 16 KiB UTF-8. Larger ones are
  // ignored and the params cannot be validated before the gateway's configure.
  string params_schema_json = 6;
  // JSON Schema of RouterMember.params_json, same limit.
  string member_schema_json = 7;
  // Changes whenever any field above does.
  string digest = 8;
}

message Ack {
  uint64 version = 1;
}

message Nack {
  uint64 version = 1;
  // Sanitized, never contains secrets.
  string reason = 2;
  // Version the gateway is actually running.
  uint64 have_version = 3;
  NackCode code = 4;
}

enum NackCode {
  NACK_CODE_UNSPECIFIED = 0;
  // Delta base != gateway's version; control plane answers with a full.
  NACK_CODE_BASE_MISMATCH = 1;
  // Snapshot failed validation; control plane must not resend the same
  // version (quarantine it) until a newer version exists.
  NACK_CODE_INVALID_CONFIG = 2;
  NACK_CODE_UNSUPPORTED_FEATURE = 3;
  // Could not persist to disk; control plane may retry with backoff.
  NACK_CODE_PERSIST_FAILED = 4;
}

message ConfigUpdate {
  oneof update {
    Snapshot full = 1;
    Delta delta = 2;
  }
  // Control plane's digest of the resulting snapshot version (opaque to the
  // gateway: stored next to the snapshot and echoed in Hello.have_digest).
  bytes target_digest = 3;
}

// Applies on top of base_version to produce version. A gateway whose current
// version != base_version NACKs it, and the control plane answers with a full
// snapshot.
message Delta {
  uint64 base_version = 1;
  uint64 version = 2;
  repeated Upstream upsert_upstreams = 3;
  repeated string remove_upstreams = 4;
  repeated Model upsert_models = 5;
  repeated string remove_models = 6;
  repeated Router upsert_routers = 7;
  repeated string remove_routers = 8;
  repeated ApiKey upsert_api_keys = 9;
  // key_id values.
  repeated string remove_api_keys = 10;
  repeated Team upsert_teams = 11;
  repeated string remove_teams = 12;
  // Target snapshot metadata, replaced wholesale.
  int64 created_at_unix_ms = 13;
  repeated string required_capabilities = 14;
  repeated Alias upsert_aliases = 15;
  repeated string remove_aliases = 16;
}
