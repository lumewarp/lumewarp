syntax = "proto3";

package lumewarp.usage.v1;

// Gateway -> control plane usage reporting. The gateway batches events off the
// request path and reports them asynchronously; a failed report is retried
// from a bounded buffer and dropped (and counted) when the buffer is full.
// Authenticated with the same gateway token as ConfigService; the control
// plane ignores ReportRequest.gateway_id in favour of the token's identity.
service UsageService {
  // Validated per event: an invalid event is skipped and logged, the rest are
  // durably accounted, and `accepted` counts what was kept (already seen
  // request_ids count as accepted). Only batch-level errors (gateway identity,
  // too many events) fail the call with INVALID_ARGUMENT, recording nothing.
  rpc Report(ReportRequest) returns (ReportResponse);
}

message ReportRequest {
  string gateway_id = 1;
  repeated UsageEvent events = 2;
}

message ReportResponse {
  uint32 accepted = 1;
}

message UsageEvent {
  // Gateway-generated UUID, fixed at request start and reused on retries;
  // never derived from client or upstream ids. The control plane dedupes on
  // it.
  string request_id = 1;
  // Completion time; budget windows are attributed by this timestamp (UTC).
  int64 timestamp_unix_ms = 2;
  // The control plane derives the key's owner (member or service account)
  // from key_id.
  string key_id = 3;
  reserved 4, 6;
  reserved "org_id", "project_id";
  string team_id = 5;
  // The name the client called (model, alias or router), also when rejected or
  // not found. Empty only when authentication failed: the body was not read.
  // At most 400 bytes.
  string requested = 7;
  // The model that finally served the request; prices and cost follow it.
  // Empty when no model was selected.
  string model = 8;
  // Endpoint: chat_completions | completions | embeddings | mcp | a2a.
  string endpoint = 9;
  uint32 status = 10;
  bool stream = 11;
  uint64 prompt_tokens = 12;
  uint64 completion_tokens = 13;
  reserved 14;
  reserved "cost_usd";
  uint32 duration_ms = 15;
  // Snapshot version the request was served with; its model price is
  // the one used for cost.
  uint64 config_version = 16;
  UsageState usage_state = 17;
  RequestOutcome outcome = 18;
  int64 started_at_unix_ms = 19;
  // nano-USD computed from the model price. Meaningful only when
  // cost_known is true (price present and usage_state REPORTED).
  uint64 cost_nano_usd = 20;
  bool cost_known = 21;
  // The alias called, empty if the name called was not an alias.
  string alias = 22;
  // The router behind the name called, empty for a direct model.
  string router = 23;
  // Upstream and upstream model name of `model`, sent by the gateway so that a
  // later catalog change cannot rewrite history.
  string upstream = 24;
  string upstream_model = 25;
  // `model` is one of the router's fallbacks.
  bool fallback = 26;
  // Upstream attempts of this request, retries and fallbacks included.
  uint32 attempts = 27;
  // LLM when unspecified. For MCP and A2A, `model`, `alias`, `router`,
  // `upstream*`, tokens and cost are empty, and `requested` is empty.
  TrafficKind kind = 28;
  // McpServer.name or A2aAgent.name; empty when the request named none that
  // the key may see.
  string target = 29;
  // JSON-RPC method, at most 128 bytes ("tools/call", "SendStreamingMessage", ...).
  string method = 30;
  // MCP tools/call and prompts/get: the upstream tool or prompt name, at
  // most 400 bytes.
  string tool = 31;
}

enum TrafficKind {
  TRAFFIC_KIND_UNSPECIFIED = 0;
  TRAFFIC_KIND_LLM = 1;
  TRAFFIC_KIND_MCP = 2;
  TRAFFIC_KIND_A2A = 3;
}

enum UsageState {
  USAGE_STATE_UNSPECIFIED = 0;
  // Upstream reported final usage.
  USAGE_STATE_REPORTED = 1;
  // No usage available (passthrough stream, upstream omitted it).
  USAGE_STATE_MISSING = 2;
  // Stream ended early (cancel / error) before final usage arrived.
  USAGE_STATE_PARTIAL = 3;
  // Body exceeded the capture cap or could not be parsed.
  USAGE_STATE_INVALID = 4;
}

enum RequestOutcome {
  REQUEST_OUTCOME_UNSPECIFIED = 0;
  REQUEST_OUTCOME_COMPLETED = 1;
  REQUEST_OUTCOME_CLIENT_CANCELLED = 2;
  REQUEST_OUTCOME_UPSTREAM_ERROR = 3;
  REQUEST_OUTCOME_REJECTED = 4;
}
