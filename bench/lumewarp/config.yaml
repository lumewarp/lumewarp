# Standalone Lumewarp config used by bench/scripts/run.sh.
#
#   lumewarp --config bench/lumewarp/config.yaml
#
# One upstream (the mock) and one route, so the benchmark measures the gateway
# hot path and nothing else. `server.api_keys` is deliberately unset: the bench
# compares the unauthenticated hot path against LiteLLM with no master key.
# run.sh rewrites the ports below if MOCK_PORT / LUMEWARP_PORT are overridden.
server:
  listen: 127.0.0.1:4000

upstreams:
  - name: mock
    kind: openai_compatible
    base_url: http://127.0.0.1:9000/v1
    # The mock ignores auth, so no api_key_env is set (no bearer header is sent).

deployments:
  - name: mock-deployment
    upstream: mock
    upstream_model: mock

routes:
  - model: mock
    deployments: [mock-deployment]
