# Standalone Lumewarp config used by bench/scripts/run.sh.
#
#   lumewarp --config bench/lumewarp/config.yaml
#
# One upstream (the mock) and one router, so the benchmark measures the gateway
# hot path and nothing else. `server.api_keys` is empty by default: the bench
# compares the unauthenticated hot path against LiteLLM with no master key.
# With BENCH_AUTH=1, run.sh replaces the empty list below with the SHA-256 of
# that run's key (the raw key only goes to the load generators). run.sh rewrites
# the ports below if MOCK_PORT / LUMEWARP_PORT are overridden.
server:
  listen: 127.0.0.1:4000
  # Empty list = no client auth. BENCH_AUTH=1 templates this line; the marker
  # stays so the driver can verify the substitution.
  api_keys: [] # __BENCH_API_KEYS__

upstreams:
  - name: mock
    kind: openai_compatible
    base_url: http://127.0.0.1:9000/v1
    # The mock ignores auth, so no api_key_env is set (no bearer header is sent).

models:
  - name: mock-model
    upstream: mock
    upstream_model: mock
    type: llm

routers:
  # Called name == upstream_model: the fast path, no response scanning.
  - name: mock
    members:
      - {model: mock-model}
  # The same pool under another name: the response `model` is rewritten
  # (BENCH_REWRITE=1 measures it as the `lumewarp-rewrite` target).
  - name: mock-renamed
    members:
      - {model: mock-model}
