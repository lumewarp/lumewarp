[package]
name = "mock-mcp"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Controllable MCP upstream for Lumewarp tests and benchmarks"

[dependencies]
arc-swap = "1"
async-stream = "0.3"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "signal", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }

[profile.release]
lto = true
codegen-units = 1
