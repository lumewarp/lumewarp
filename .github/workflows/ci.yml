name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The nightly schedule and manual dispatch run only the load-e2e job.
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

jobs:
  gateway:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gateway
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  bench-crate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bench/mock-upstream
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bench/mock-upstream
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Bench scripts
        working-directory: .
        run: |
          bash -n bench/scripts/run.sh
          python3 -I bench/scripts/aggregate.py --selftest
          python3 -I bench/scripts/ci_check.py --selftest

  control-plane:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lumewarp
          POSTGRES_PASSWORD: lumewarp
          POSTGRES_DB: lumewarp
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U lumewarp -d lumewarp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Load helper unit tests
        working-directory: .
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          E2E_GATEWAY_BIN: /nonexistent
          E2E_MOCK_BIN: /nonexistent
        run: |
          uv run --frozen --project control-plane pytest -c tests/load/pytest.ini \
            --rootdir tests/load tests/load/test_loadlib_unit.py -q -p no:cacheprovider

  ui:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  proto:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          input: proto
          breaking: false
          push: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Check generated protobuf code is current
        run: |
          ./scripts/gen-proto.sh
          if ! git diff --exit-code -- control-plane/src/lumewarp_control_plane/_proto; then
            echo "::error::generated protobuf code is stale; run scripts/gen-proto.sh and commit the result"
            exit 1
          fi
          status="$(git status --porcelain -- control-plane/src/lumewarp_control_plane/_proto)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            echo "::error::scripts/gen-proto.sh produced untracked files under control-plane/src/lumewarp_control_plane/_proto; commit the generated code"
            exit 1
          fi

  e2e:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lumewarp
          POSTGRES_PASSWORD: lumewarp
          POSTGRES_DB: lumewarp
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U lumewarp -d lumewarp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            gateway
            bench/mock-upstream
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --project control-plane
      - name: P1 exit gate (Postgres + control plane + gateway + mock upstream)
        env:
          E2E_PG_URL: postgresql://lumewarp:lumewarp@127.0.0.1:55432/lumewarp
        run: scripts/e2e-p1.sh

  load-e2e:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lumewarp
          POSTGRES_PASSWORD: lumewarp
          POSTGRES_DB: lumewarp
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U lumewarp -d lumewarp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            gateway
            bench/mock-upstream
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --project control-plane
      - name: Load e2e (Locust against PG + control plane + gateway + mock upstream)
        env:
          E2E_PG_URL: postgresql://lumewarp:lumewarp@127.0.0.1:55432/lumewarp
          LOAD_RESULTS_DIR: ${{ github.workspace }}/load-results
          # Hosted runners have 4 vCPUs shared by every process: lighter load.
          LOAD_USERS: "20"
          LOAD_PROCESSES: "2"
        run: scripts/load-e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-e2e-results
          path: load-results
          if-no-files-found: ignore
