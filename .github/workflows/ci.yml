name: ci

# A commit is tested once: a PR run, then the push to main only when its tree
# differs from a PR head that already passed; each job runs only when its paths
# changed since the last successful run on main. The push of a `Release vX.Y.Z`
# commit (scripts/release.sh) runs every job, and the release workflow reuses
# that run for the tag.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Run every job"
        type: boolean
        default: false
      load:
        description: "Run load-e2e"
        type: boolean
        default: true
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true
      load:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ format('{0}', inputs.full) }}
  # A newer push to main or a PR supersedes the older run; the next run diffs
  # against the last successful one, so nothing a cancelled run held is lost.
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      observability: ${{ steps.decide.outputs.observability }}
      gateway: ${{ steps.decide.outputs.gateway }}
      bench-crate: ${{ steps.decide.outputs.bench-crate }}
      control-plane: ${{ steps.decide.outputs.control-plane }}
      ui: ${{ steps.decide.outputs.ui }}
      proto: ${{ steps.decide.outputs.proto }}
      e2e: ${{ steps.decide.outputs.e2e }}
      load: ${{ steps.decide.outputs.load }}
    env:
      GH_TOKEN: ${{ github.token }}
      # Empty on push and pull_request; set when dispatched or called.
      FULL_INPUT: ${{ format('{0}', inputs.full) }}
      LOAD_INPUT: ${{ format('{0}', inputs.load) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find what was already tested
        id: base
        if: env.FULL_INPUT == ''
        env:
          EVENT: ${{ github.event_name }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          full=false skip=false base=""
          if [[ "$EVENT" == "push" ]]; then
            if [[ "$HEAD_MESSAGE" =~ ^Release\ v[0-9] ]]; then
              full=true
            fi
            # Merged from a PR whose head (same tree) already passed: nothing new to test.
            pr_head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq '[.[] | select(.merged_at != null)][0].head.sha // empty' || true)"
            if [[ -n "$pr_head" && "$full" == false ]]; then
              pr_tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${pr_head}" --jq .tree.sha || true)"
              passed="$(gh run list --workflow ci.yml --commit "$pr_head" --event pull_request \
                --status success --json databaseId --jq length || echo 0)"
              if [[ "$pr_tree" == "$(git rev-parse 'HEAD^{tree}')" && "$passed" != 0 ]]; then
                skip=true
                echo "::notice::tree already passed on PR head ${pr_head}; skipping"
              fi
            fi
            # Diff against the last successful push run, not the previous push:
            # a cancelled or failed run's changes are tested again.
            base="$(gh run list --workflow ci.yml --branch main --event push --status success \
              --limit 1 --json headSha --jq '.[0].headSha // empty' || true)"
            if [[ -z "$base" ]] || ! git merge-base --is-ancestor "$base" HEAD; then
              full=true
            fi
          fi
          {
            echo "full=$full"
            echo "skip=$skip"
            echo "base=$base"
          } >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v3
        id: paths
        if: env.FULL_INPUT == '' && steps.base.outputs.full == 'false' && steps.base.outputs.skip == 'false'
        with:
          base: ${{ steps.base.outputs.base }}
          # A file counts for a job when it matches every pattern of the job's list.
          predicate-quantifier: every
          filters: |
            workflow:
              - '.github/workflows/ci.yml'
            observability:
              - 'deploy/**'
              - '!**/*.md'
            gateway:
              - '{gateway,proto,bench/mock-upstream}/**'
              - '!**/*.md'
            bench-crate:
              - 'bench/**'
              - '!**/*.md'
            control-plane:
              - '{control-plane,proto,tests/load}/**'
              - '!**/*.md'
            ui:
              - '{ui,control-plane}/**'
              - '!**/*.md'
            proto:
              - '{proto/**,scripts/gen-proto.sh,control-plane/src/lumewarp_control_plane/_proto/**}'
              - '!**/*.md'
            e2e:
              - '{gateway,control-plane,proto,bench/mock-upstream,tests/e2e,scripts}/**'
              - '!**/*.md'
      - name: Decide which jobs run
        id: decide
        env:
          FULL: ${{ steps.base.outputs.full }}
          SKIP: ${{ steps.base.outputs.skip }}
          PATHS: ${{ toJSON(steps.paths.outputs) }}
        run: |
          python3 -I - <<'PY'
          import json, os
          jobs = ["observability", "gateway", "bench-crate", "control-plane", "ui", "proto", "e2e"]
          called = os.environ["FULL_INPUT"] != ""
          paths = json.loads(os.environ["PATHS"] or "{}") or {}
          if called:
              full, skip = os.environ["FULL_INPUT"] == "true", False
              load = os.environ["LOAD_INPUT"] == "true"
          else:
              full = os.environ["FULL"] == "true" or paths.get("workflow") == "true"
              skip, load = os.environ["SKIP"] == "true", False
          out = {job: str(not skip and (full or paths.get(job) == "true")).lower() for job in jobs}
          out["load"] = str(load).lower()
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              for job, run in out.items():
                  f.write(f"{job}={run}\n")
          print(json.dumps(out))
          PY

  observability:
    needs: changes
    if: needs.changes.outputs.observability == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prometheus rules and alert unit tests
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/w" -w /w \
            --entrypoint promtool prom/prometheus:v3.5.0 check rules rules.yaml
          docker run --rm -v "$PWD/deploy/prometheus:/w" -w /w \
            --entrypoint promtool prom/prometheus:v3.5.0 test rules rules.test.yaml
      - name: Dashboard JSON, PromQL and bundled chart assets
        run: |
          python3 - <<'PY'
          import json
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          chart = Path("deploy/helm/lumewarp/files")
          source = Path("deploy/prometheus/rules.yaml")
          assert source.read_bytes() == (chart / "prometheus/rules.yaml").read_bytes()
          dashboards = sorted(Path("deploy/grafana/dashboards").glob("*.json"))
          assert len(dashboards) == 5
          assert {p.name for p in dashboards} == {p.name for p in (chart / "dashboards").glob("*.json")}
          rules = []
          for path in dashboards:
              assert path.read_bytes() == (chart / "dashboards" / path.name).read_bytes()
              dashboard = json.loads(path.read_text())
              assert dashboard["uid"] == path.stem
              assert dashboard["schemaVersion"] >= 39
              expressions = [t["expr"] for p in dashboard["panels"] for t in p["targets"]]
              for variable in dashboard["templating"]["list"]:
                  if variable["type"] == "query":
                      match = re.fullmatch(r"label_values\((.*),\s*\w+\)", variable["query"]["query"])
                      assert match, variable
                      expressions.append(match[1])
              for expr in expressions:
                  expr = expr.replace("$__rate_interval", "5m").replace("$__range", "1h")
                  expr = re.sub(r"\$\{\w+:regex\}", ".*", expr)
                  assert "$" not in expr, expr
                  rules.append({"record": f"dashboard_expr_{len(rules)}", "expr": expr})
          with tempfile.TemporaryDirectory() as directory:
              # promtool runs as nobody inside the pinned image.
              Path(directory).chmod(0o755)
              path = Path(directory) / "dashboards.rules.json"
              path.write_text(json.dumps({"groups": [{"name": "dashboards", "rules": rules}]}))
              subprocess.run(["docker", "run", "--rm", "-v", f"{directory}:/w", "-w", "/w",
                              "--entrypoint", "promtool", "prom/prometheus:v3.5.0",
                              "check", "rules", path.name], check=True)
          print(f"Validated {len(dashboards)} dashboards, {len(rules)} expressions and chart copies")
          PY

  gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gateway
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Build the example and test WASM plugins
        run: bash plugins/build.sh --tests
      - name: Build the MCP/A2A mock the MCP tests spawn
        run: cargo build --manifest-path ../bench/mock-upstream/Cargo.toml --bin mcp-a2a-mock
      - run: cargo test
      - name: Built-in plugin manifest matches the control plane's copy
        run: |
          manifest=../control-plane/src/lumewarp_control_plane/compiler/builtin_plugins.json
          if ! cargo run --locked -q -p lumewarp-gateway -- plugins --json | diff - "$manifest"; then
            echo "::error::regenerate with: cd gateway && cargo run -p lumewarp-gateway -- plugins --json > $manifest"
            exit 1
          fi

  bench-crate:
    needs: changes
    if: needs.changes.outputs.bench-crate == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bench/mock-upstream
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bench/mock-upstream
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Bench scripts
        working-directory: .
        run: |
          bash -n bench/scripts/run.sh
          python3 -I bench/scripts/aggregate.py --selftest
          python3 -I bench/scripts/ci_check.py --selftest

  control-plane:
    needs: changes
    if: needs.changes.outputs.control-plane == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lumewarp
          POSTGRES_PASSWORD: lumewarp
          POSTGRES_DB: lumewarp
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U lumewarp -d lumewarp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Load helper unit tests
        working-directory: .
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          E2E_GATEWAY_BIN: /nonexistent
          E2E_MOCK_BIN: /nonexistent
        run: |
          uv run --frozen --project control-plane pytest -c tests/load/pytest.ini \
            --rootdir tests/load tests/load/test_loadlib_unit.py -q -p no:cacheprovider

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    # Setup (uv sync, pnpm install, browser) plus the suite, which takes about 4 minutes.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lumewarp
          POSTGRES_PASSWORD: lumewarp
          POSTGRES_DB: lumewarp
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U lumewarp -d lumewarp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # The version comes from packageManager, which lives in ui/, not the root.
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --project ../control-plane
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - name: Playwright (serve.py creates a fresh database on the Postgres service)
        env:
          # serve.py reads LUMEWARP_TEST_DATABASE_URL (an asyncpg URL), not E2E_PG_URL.
          LUMEWARP_TEST_DATABASE_URL: postgresql+asyncpg://lumewarp:lumewarp@127.0.0.1:55432/lumewarp
        run: pnpm test:e2e
      # A failure here is usually a CI-only focus/portal/timing difference: keep the trace and error context.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-playwright-results
          path: ui/test-results/
          retention-days: 7
          if-no-files-found: ignore

  proto:
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          input: proto
          breaking: false
          push: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Check generated protobuf code is current
        run: |
          ./scripts/gen-proto.sh
          if ! git diff --exit-code -- control-plane/src/lumewarp_control_plane/_proto; then
            echo "::error::generated protobuf code is stale; run scripts/gen-proto.sh and commit the result"
            exit 1
          fi
          status="$(git status --porcelain -- control-plane/src/lumewarp_control_plane/_proto)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            echo "::error::scripts/gen-proto.sh produced untracked files under control-plane/src/lumewarp_control_plane/_proto; commit the generated code"
            exit 1
          fi

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lumewarp
          POSTGRES_PASSWORD: lumewarp
          POSTGRES_DB: lumewarp
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U lumewarp -d lumewarp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            gateway
            bench/mock-upstream
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --project control-plane
      - name: Core e2e gate (Postgres + control plane + gateway + mock upstream)
        env:
          E2E_PG_URL: postgresql://lumewarp:lumewarp@127.0.0.1:55432/lumewarp
        run: scripts/e2e-core.sh

  load-e2e:
    needs: changes
    if: needs.changes.outputs.load == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lumewarp
          POSTGRES_PASSWORD: lumewarp
          POSTGRES_DB: lumewarp
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U lumewarp -d lumewarp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            gateway
            bench/mock-upstream
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --project control-plane
      - name: Load e2e (Locust against PG + control plane + gateway + mock upstream)
        env:
          E2E_PG_URL: postgresql://lumewarp:lumewarp@127.0.0.1:55432/lumewarp
          LOAD_RESULTS_DIR: ${{ github.workspace }}/load-results
          # Hosted runners have 4 vCPUs shared by every process: lighter load.
          LOAD_USERS: "20"
          LOAD_PROCESSES: "2"
        run: scripts/load-e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-e2e-results
          path: load-results
          if-no-files-found: ignore
