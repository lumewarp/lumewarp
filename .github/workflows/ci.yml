name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gateway
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  bench-crate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bench/mock-upstream
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bench/mock-upstream
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Bench scripts
        working-directory: .
        run: |
          bash -n bench/scripts/run.sh
          python3 -I bench/scripts/aggregate.py --selftest
          python3 -I bench/scripts/ci_check.py --selftest

  control-plane:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lumewarp
          POSTGRES_PASSWORD: lumewarp
          POSTGRES_DB: lumewarp
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U lumewarp -d lumewarp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          input: proto
          breaking: false
          push: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Check generated protobuf code is current
        run: |
          ./scripts/gen-proto.sh
          if ! git diff --exit-code -- control-plane/src/lumewarp_control_plane/_proto; then
            echo "::error::generated protobuf code is stale; run scripts/gen-proto.sh and commit the result"
            exit 1
          fi
          status="$(git status --porcelain -- control-plane/src/lumewarp_control_plane/_proto)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            echo "::error::scripts/gen-proto.sh produced untracked files under control-plane/src/lumewarp_control_plane/_proto; commit the generated code"
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lumewarp
          POSTGRES_PASSWORD: lumewarp
          POSTGRES_DB: lumewarp
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U lumewarp -d lumewarp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            gateway
            bench/mock-upstream
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --project control-plane
      - name: P1 exit gate (Postgres + control plane + gateway + mock upstream)
        env:
          E2E_PG_URL: postgresql://lumewarp:lumewarp@127.0.0.1:55432/lumewarp
        run: scripts/e2e-p1.sh
