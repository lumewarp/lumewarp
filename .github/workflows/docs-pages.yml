name: docs-pages

# Publishes the manual to GitHub Pages (https://lumewarp.github.io/lumewarp/) from main.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "control-plane/src/**"
      - "gateway/crates/lumewarp-gateway/src/**"
      - ".claude/skills/**"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gateway
      - run: uv sync --locked --project ../control-plane
      - run: pnpm install --frozen-lockfile
      # Generates both OpenAPI documents, then builds for the Pages path.
      - run: pnpm build
        env:
          LUMEWARP_DOCS_BASE: /lumewarp/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
