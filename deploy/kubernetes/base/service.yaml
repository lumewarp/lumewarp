apiVersion: v1
kind: Service
metadata:
  name: lumewarp-control-plane
  labels:
    app.kubernetes.io/name: lumewarp
    app.kubernetes.io/instance: lumewarp
    app.kubernetes.io/version: "0.2.0"
    app.kubernetes.io/component: control-plane
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8091
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
    - name: metrics
      port: 9465
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/name: lumewarp
    app.kubernetes.io/instance: lumewarp
    app.kubernetes.io/component: control-plane
---
apiVersion: v1
kind: Service
metadata:
  name: lumewarp-gateway
  labels:
    app.kubernetes.io/name: lumewarp
    app.kubernetes.io/instance: lumewarp
    app.kubernetes.io/version: "0.2.0"
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 4000
      targetPort: http
      protocol: TCP
    # Keep the admin listener on a Service port so a ServiceMonitor (or a manually
    # configured scrape) can reach /metrics without a pod-level relabel.
    - name: admin
      port: 9464
      targetPort: admin
      protocol: TCP
  selector:
    app.kubernetes.io/name: lumewarp
    app.kubernetes.io/instance: lumewarp
    app.kubernetes.io/component: gateway
