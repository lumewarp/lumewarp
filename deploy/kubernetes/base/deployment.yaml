apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumewarp-control-plane
  labels:
    app.kubernetes.io/name: lumewarp
    app.kubernetes.io/instance: lumewarp
    app.kubernetes.io/version: "0.2.0"
    app.kubernetes.io/component: control-plane
spec:
  # Always one pod: the compiler and rollover scheduler run once per installation.
  replicas: 1
  # One writer: the compiler and rollover scheduler must not run in two pods. Recreate
  # avoids overlap during upgrades.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lumewarp
      app.kubernetes.io/instance: lumewarp
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lumewarp
        app.kubernetes.io/instance: lumewarp
        app.kubernetes.io/component: control-plane
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      containers:
        - name: control-plane
          image: "ghcr.io/lumewarp/lumewarp-control-plane:0.2.0"
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - lumewarp_control_plane
          args:
            - serve
          ports:
            - name: http
              containerPort: 8091
              protocol: TCP
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: metrics
              containerPort: 9465
              protocol: TCP
          env:
            - name: LUMEWARP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lumewarp-control-plane
                  key: database-url
            - name: LUMEWARP_HTTP_BIND
              value: "0.0.0.0:8091"
            - name: LUMEWARP_GRPC_BIND
              value: "0.0.0.0:50051"
            - name: LUMEWARP_SCOPE
              value: "default"
            - name: LUMEWARP_METRICS_BIND
              value: "0.0.0.0:9465"
            - name: LUMEWARP_INITIAL_ADMIN_EMAIL
              value: ""
            - name: LUMEWARP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: lumewarp-encryption-key
                  key: encryption-key

          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumewarp-gateway
  labels:
    app.kubernetes.io/name: lumewarp
    app.kubernetes.io/instance: lumewarp
    app.kubernetes.io/version: "0.2.0"
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lumewarp
      app.kubernetes.io/instance: lumewarp
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lumewarp
        app.kubernetes.io/instance: lumewarp
        app.kubernetes.io/component: gateway
      annotations:
        checksum/config: ba96baaac941d78a0cb9ea60d4b31a7bd826d153217f96c77d129555f1b87e67
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      terminationGracePeriodSeconds: 35
      containers:
        - name: gateway
          image: "ghcr.io/lumewarp/lumewarp-gateway:0.2.0"
          imagePullPolicy: IfNotPresent
          # The image must put the gateway binary on PATH.
          command:
            - lumewarp
          args:
            - --control-plane=$(LUMEWARP_CONTROL_PLANE_URL)
            - --gateway-token-env=LUMEWARP_GATEWAY_TOKEN
            - --state-dir=/var/lib/lumewarp
            - --scope=$(LUMEWARP_SCOPE)
            - --local-config=/etc/lumewarp/config.yaml
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
            - name: admin
              containerPort: 9464
              protocol: TCP
          env:
            - name: LUMEWARP_CONTROL_PLANE_URL
              value: "http://lumewarp-control-plane:50051"
            - name: LUMEWARP_SCOPE
              value: "default"
            - name: LUMEWARP_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lumewarp-gateway
                  key: token
            - name: LUMEWARP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: lumewarp-encryption-key
                  key: encryption-key
          # /readyz is 503 until a valid snapshot is loaded (cold boot with the control
          # plane unreachable) or after a rejected snapshot. Liveness stays 200 so the
          # pod is not restarted for being unready.
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/lumewarp
              readOnly: true
            - name: state
              mountPath: /var/lib/lumewarp
      volumes:
        - name: config
          configMap:
            name: lumewarp-gateway-config
        - name: state
          emptyDir: {}
