apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumewarp-control-plane
  labels:
    app.kubernetes.io/name: lumewarp
    app.kubernetes.io/instance: lumewarp
    app.kubernetes.io/version: "0.2.0"
    app.kubernetes.io/component: control-plane
spec:
  # Always one pod: the compiler and rollover scheduler run once per installation.
  replicas: 1
  # One writer: the compiler and rollover scheduler must not run in two pods. Recreate
  # avoids overlap during upgrades.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lumewarp
      app.kubernetes.io/instance: lumewarp
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lumewarp
        app.kubernetes.io/instance: lumewarp
        app.kubernetes.io/component: control-plane
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      initContainers:
        # Idempotent: creates the store and writes the model only when they are missing.
        - name: openfga-init
          image: "ghcr.io/lumewarp/lumewarp-control-plane:0.2.0"
          imagePullPolicy: IfNotPresent
          command: [python, -m, lumewarp_control_plane, openfga, init]
          env:

            - name: LUMEWARP_AUTHZ_BACKEND
              value: "openfga"
            - name: LUMEWARP_OPENFGA_URL
              value: "http://lumewarp-openfga:8080"
            - name: LUMEWARP_OPENFGA_STORE
              value: "lumewarp"
      containers:
        - name: control-plane
          image: "ghcr.io/lumewarp/lumewarp-control-plane:0.2.0"
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - lumewarp_control_plane
          args:
            - serve
          ports:
            - name: http
              containerPort: 8091
              protocol: TCP
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: metrics
              containerPort: 9465
              protocol: TCP
          env:
            - name: LUMEWARP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lumewarp-database
                  key: database-url
            - name: LUMEWARP_HTTP_BIND
              value: "0.0.0.0:8091"
            - name: LUMEWARP_GRPC_BIND
              value: "0.0.0.0:50051"
            - name: LUMEWARP_SCOPE
              value: "default"
            - name: LUMEWARP_METRICS_BIND
              value: "0.0.0.0:9465"
            - name: LUMEWARP_INITIAL_ADMIN_EMAIL
              value: ""
            - name: LUMEWARP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: lumewarp-encryption-key
                  key: encryption-key

            - name: LUMEWARP_AUTHZ_BACKEND
              value: "openfga"
            - name: LUMEWARP_OPENFGA_URL
              value: "http://lumewarp-openfga:8080"
            - name: LUMEWARP_OPENFGA_STORE
              value: "lumewarp"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumewarp-gateway
  labels:
    app.kubernetes.io/name: lumewarp
    app.kubernetes.io/instance: lumewarp
    app.kubernetes.io/version: "0.2.0"
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lumewarp
      app.kubernetes.io/instance: lumewarp
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lumewarp
        app.kubernetes.io/instance: lumewarp
        app.kubernetes.io/component: gateway
      annotations:
        checksum/config: ba96baaac941d78a0cb9ea60d4b31a7bd826d153217f96c77d129555f1b87e67
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      terminationGracePeriodSeconds: 35
      containers:
        - name: gateway
          image: "ghcr.io/lumewarp/lumewarp-gateway:0.2.0"
          imagePullPolicy: IfNotPresent
          # The image must put the gateway binary on PATH.
          command:
            - lumewarp
          args:
            - --control-plane=$(LUMEWARP_CONTROL_PLANE_URL)
            - --gateway-token-env=LUMEWARP_GATEWAY_TOKEN
            - --state-dir=/var/lib/lumewarp
            - --scope=$(LUMEWARP_SCOPE)
            - --local-config=/etc/lumewarp/config.yaml
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
            - name: admin
              containerPort: 9464
              protocol: TCP
          env:
            - name: LUMEWARP_CONTROL_PLANE_URL
              value: "http://lumewarp-control-plane:50051"
            - name: LUMEWARP_SCOPE
              value: "default"
            - name: LUMEWARP_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lumewarp-gateway
                  key: token
            - name: LUMEWARP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: lumewarp-encryption-key
                  key: encryption-key
          # /readyz is 503 until a valid snapshot is loaded (cold boot with the control
          # plane unreachable) or after a rejected snapshot. Liveness stays 200 so the
          # pod is not restarted for being unready.
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/lumewarp
              readOnly: true
            - name: state
              mountPath: /var/lib/lumewarp
      volumes:
        - name: config
          configMap:
            name: lumewarp-gateway-config
        - name: state
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumewarp-openfga
  labels:
    app.kubernetes.io/name: openfga
    app.kubernetes.io/instance: lumewarp
    app.kubernetes.io/component: authorization-controller
    app.kubernetes.io/version: "v1.22.1"
    app.kubernetes.io/part-of: openfga
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openfga
      app.kubernetes.io/instance: lumewarp
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "2112"
      labels:
        app.kubernetes.io/name: openfga
        app.kubernetes.io/instance: lumewarp
        app.kubernetes.io/component: authorization-controller
        app.kubernetes.io/version: "v1.22.1"
        app.kubernetes.io/part-of: openfga
    spec:
      serviceAccountName: lumewarp-openfga
      securityContext:
        {}

      initContainers:
        - name: wait-for-migration
          securityContext:
            {}
          image: "groundnuty/k8s-wait-for:v2.0"
          imagePullPolicy: IfNotPresent
          args: ["job-wr", 'lumewarp-openfga-migrate']
          resources:
            {}
      containers:
        - name: openfga
          securityContext:
            {}
          image: "openfga/openfga:v1.22.1"
          imagePullPolicy: Always
          args: ["run"]
          ports:
            - name: grpc
              containerPort: 8081

            - name: http
              containerPort: 8080
              protocol: TCP

            - name: profiler
              containerPort: 3001
              protocol: TCP

            - name: playground
              containerPort: 3000
              protocol: TCP
            - name: metrics
              containerPort: 2112
              protocol: TCP

          env:
            - name: OPENFGA_DATASTORE_ENGINE
              value: "postgres"
            - name: OPENFGA_DATASTORE_URI
              valueFrom:
                secretKeyRef:
                  name: "lumewarp-openfga-datastore"
                  key: uri


            - name: OPENFGA_DATASTORE_METRICS_ENABLED
              value: "false"
            - name: OPENFGA_GRPC_ADDR
              value: "0.0.0.0:8081"

            - name: OPENFGA_HTTP_ENABLED
              value: "true"
            - name: OPENFGA_HTTP_ADDR
              value: "0.0.0.0:8080"
            - name: OPENFGA_HTTP_CORS_ALLOWED_ORIGINS
              value: "*"
            - name: OPENFGA_HTTP_CORS_ALLOWED_HEADERS
              value: "*"

            - name: OPENFGA_PLAYGROUND_ENABLED
              value: "true"
            - name: OPENFGA_PLAYGROUND_PORT
              value: "3000"
            - name: OPENFGA_LOG_FORMAT
              value: json
            - name: OPENFGA_LOG_LEVEL
              value: info
            - name: OPENFGA_LOG_TIMESTAMP_FORMAT
              value: Unix
            - name: OPENFGA_REQUEST_DURATION_DATASTORE_QUERY_COUNT_BUCKETS
              value: "50,200"

            - name: OPENFGA_METRICS_ENABLED
              value: "true"
            - name: OPENFGA_METRICS_ADDR
              value: "0.0.0.0:2112"
          readinessProbe:
            failureThreshold: 6
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
            grpc:
              port: 8081
          livenessProbe:
            failureThreshold: 12
            initialDelaySeconds: 60
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
            grpc:
              port: 8081

          resources:
            {}
