apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lumewarp-postgres
  labels:
    app.kubernetes.io/name: lumewarp-stack
    app.kubernetes.io/instance: lumewarp
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  serviceName: lumewarp-postgres
  selector:
    matchLabels:
      app.kubernetes.io/name: lumewarp-stack
      app.kubernetes.io/instance: lumewarp
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lumewarp-stack
        app.kubernetes.io/instance: lumewarp
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      # The alpine image's postgres user is 70:70.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: "postgres:17.12-alpine"
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "lumewarp"
            - name: POSTGRES_DB
              value: "lumewarp"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lumewarp-postgres
                  key: password
            # A subdirectory: the volume root can hold lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: lumewarp-postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
