apiVersion: batch/v1
kind: Job
metadata:
  name: lumewarp-migrate-1
  labels:
    app.kubernetes.io/name: lumewarp-stack
    app.kubernetes.io/instance: lumewarp
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lumewarp-stack
        app.kubernetes.io/instance: lumewarp
        app.kubernetes.io/component: migrate
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: "postgres:17.12-alpine"
          command:
            - sh
            - -c
            - 'until pg_isready -h lumewarp-postgres -p 5432; do echo waiting for postgres; sleep 2; done'
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 70
            capabilities:
              drop:
                - ALL
      containers:
        - name: migrate
          image: "ghcr.io/lumewarp/lumewarp-control-plane:0.2.0"
          imagePullPolicy: IfNotPresent
          command: [python, -m, lumewarp_control_plane]
          args: [migrate]
          env:
            - name: LUMEWARP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lumewarp-database
                  key: database-url
            - name: LUMEWARP_SCOPE
              value: "default"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: lumewarp-openfga-migrate
  labels:
    app.kubernetes.io/name: openfga
    app.kubernetes.io/instance: lumewarp
    app.kubernetes.io/component: authorization-controller
    app.kubernetes.io/version: "v1.22.1"
    app.kubernetes.io/part-of: openfga
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openfga
        app.kubernetes.io/instance: lumewarp
        app.kubernetes.io/component: authorization-controller
        app.kubernetes.io/version: "v1.22.1"
        app.kubernetes.io/part-of: openfga
    spec:
      serviceAccountName: lumewarp-openfga
      initContainers:
        - command:
          - sh
          - -c
          - until pg_isready -h lumewarp-postgres -p 5432; do sleep 2; done
          image: postgres:17.12-alpine
          name: wait-for-postgres
      containers:
        - name: migrate-database
          securityContext:
            {}
          image: "openfga/openfga:v1.22.1"
          args: ["migrate"]
          env:
            - name: OPENFGA_DATASTORE_ENGINE
              value: "postgres"
            - name: OPENFGA_DATASTORE_URI
              valueFrom:
                secretKeyRef:
                  name: "lumewarp-openfga-datastore"
                  key: uri

          resources:
            {}
      restartPolicy: Never
  backoffLimit: 1
