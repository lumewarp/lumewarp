apiVersion: v1
kind: ConfigMap
metadata:
  namespace: lumewarp
  name: lumewarp-gateway-config
  labels:
    app.kubernetes.io/name: lumewarp
    app.kubernetes.io/instance: lumewarp
    app.kubernetes.io/version: "0.2.1"
    app.kubernetes.io/component: gateway
data:
  # Control-plane mode only reads the `server:` block from --local-config; upstreams,
  # models, routers, teams and keys come from the control-plane snapshot.
  config.yaml: |
    server:
      listen: "0.0.0.0:4000"
      admin_listen: "0.0.0.0:9464"
      shutdown_grace_ms: 25000
      header_read_timeout_ms: 30000
      body_read_timeout_ms: 30000
---
apiVersion: v1
kind: Service
metadata:
  namespace: lumewarp
  name: lumewarp-gateway
  labels:
    app.kubernetes.io/name: lumewarp
    app.kubernetes.io/instance: lumewarp
    app.kubernetes.io/version: "0.2.1"
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 4000
      targetPort: http
      protocol: TCP
    # Keep the admin listener on a Service port so a ServiceMonitor (or a manually
    # configured scrape) can reach /metrics without a pod-level relabel.
    - name: admin
      port: 9464
      targetPort: admin
      protocol: TCP
  selector:
    app.kubernetes.io/name: lumewarp
    app.kubernetes.io/instance: lumewarp
    app.kubernetes.io/component: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: lumewarp
  name: lumewarp-gateway
  labels:
    app.kubernetes.io/name: lumewarp
    app.kubernetes.io/instance: lumewarp
    app.kubernetes.io/version: "0.2.1"
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lumewarp
      app.kubernetes.io/instance: lumewarp
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lumewarp
        app.kubernetes.io/instance: lumewarp
        app.kubernetes.io/component: gateway
      annotations:
        checksum/config: 2a9f386764761a58a03d20e07f65d9a443b4cb5c496ee0f84ff0421898dccf10
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      terminationGracePeriodSeconds: 35
      containers:
        - name: gateway
          image: "ghcr.io/lumewarp/lumewarp-gateway:0.2.1"
          imagePullPolicy: IfNotPresent
          # The image must put the gateway binary on PATH.
          command:
            - lumewarp
          args:
            - --control-plane=$(LUMEWARP_CONTROL_PLANE_URL)
            - --gateway-token-env=LUMEWARP_GATEWAY_TOKEN
            - --state-dir=/var/lib/lumewarp
            - --zone=$(LUMEWARP_ZONE)
            - --local-config=/etc/lumewarp/config.yaml
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
            - name: admin
              containerPort: 9464
              protocol: TCP
          env:
            - name: LUMEWARP_CONTROL_PLANE_URL
              value: "http://lumewarp-control-plane:50051"
            - name: LUMEWARP_ZONE
              value: "default"
            - name: LUMEWARP_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lumewarp-gateway-tokens
                  key: LUMEWARP_GATEWAY_ZONE_DEFAULT_TOKEN
            - name: LUMEWARP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: lumewarp-encryption-key
                  key: encryption-key
          # /readyz is 503 until a valid snapshot is loaded (cold boot with the control
          # plane unreachable) or after a rejected snapshot. Liveness stays 200 so the
          # pod is not restarted for being unready.
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/lumewarp
              readOnly: true
            - name: state
              mountPath: /var/lib/lumewarp
      volumes:
        - name: config
          configMap:
            name: lumewarp-gateway-config
        - name: state
          emptyDir: {}
