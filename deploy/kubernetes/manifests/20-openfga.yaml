apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: lumewarp
  name: lumewarp-openfga
  labels:
    app.kubernetes.io/name: openfga
    app.kubernetes.io/instance: lumewarp
    app.kubernetes.io/component: authorization-controller
    app.kubernetes.io/version: "v1.22.1"
    app.kubernetes.io/part-of: openfga
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: lumewarp
  name: lumewarp-openfga-job-status-reader
  labels:
    app.kubernetes.io/name: openfga
    app.kubernetes.io/instance: lumewarp
    app.kubernetes.io/component: authorization-controller
    app.kubernetes.io/version: "v1.22.1"
    app.kubernetes.io/part-of: openfga
rules:
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: lumewarp
  name: lumewarp-openfga-job-status-reader
  labels:
    app.kubernetes.io/name: openfga
    app.kubernetes.io/instance: lumewarp
    app.kubernetes.io/component: authorization-controller
    app.kubernetes.io/version: "v1.22.1"
    app.kubernetes.io/part-of: openfga
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lumewarp-openfga-job-status-reader
subjects:
- kind: ServiceAccount
  name: lumewarp-openfga
---
apiVersion: v1
kind: Service
metadata:
  namespace: lumewarp
  name: lumewarp-openfga
  labels:
    app.kubernetes.io/name: openfga
    app.kubernetes.io/instance: lumewarp
    app.kubernetes.io/component: authorization-controller
    app.kubernetes.io/version: "v1.22.1"
    app.kubernetes.io/part-of: openfga
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 8081
      targetPort: grpc
      protocol: TCP
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: playground
      port: 3000
      targetPort: playground
      protocol: TCP
    - name: metrics
      port: 2112
      targetPort: metrics
      protocol: TCP

  selector:
    app.kubernetes.io/name: openfga
    app.kubernetes.io/instance: lumewarp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: lumewarp
  name: lumewarp-openfga
  labels:
    app.kubernetes.io/name: openfga
    app.kubernetes.io/instance: lumewarp
    app.kubernetes.io/component: authorization-controller
    app.kubernetes.io/version: "v1.22.1"
    app.kubernetes.io/part-of: openfga
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openfga
      app.kubernetes.io/instance: lumewarp
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "2112"
      labels:
        app.kubernetes.io/name: openfga
        app.kubernetes.io/instance: lumewarp
        app.kubernetes.io/component: authorization-controller
        app.kubernetes.io/version: "v1.22.1"
        app.kubernetes.io/part-of: openfga
    spec:
      serviceAccountName: lumewarp-openfga
      securityContext:
        {}

      initContainers:
        - name: wait-for-migration
          securityContext:
            {}
          image: "groundnuty/k8s-wait-for:v2.0"
          imagePullPolicy: IfNotPresent
          args: ["job-wr", 'lumewarp-openfga-migrate']
          resources:
            {}
      containers:
        - name: openfga
          securityContext:
            {}
          image: "openfga/openfga:v1.22.1"
          imagePullPolicy: Always
          args: ["run"]
          ports:
            - name: grpc
              containerPort: 8081

            - name: http
              containerPort: 8080
              protocol: TCP

            - name: profiler
              containerPort: 3001
              protocol: TCP

            - name: playground
              containerPort: 3000
              protocol: TCP
            - name: metrics
              containerPort: 2112
              protocol: TCP

          env:
            - name: OPENFGA_DATASTORE_ENGINE
              value: "postgres"
            - name: OPENFGA_DATASTORE_URI
              valueFrom:
                secretKeyRef:
                  name: "lumewarp-openfga-datastore"
                  key: uri


            - name: OPENFGA_DATASTORE_METRICS_ENABLED
              value: "false"
            - name: OPENFGA_GRPC_ADDR
              value: "0.0.0.0:8081"

            - name: OPENFGA_HTTP_ENABLED
              value: "true"
            - name: OPENFGA_HTTP_ADDR
              value: "0.0.0.0:8080"
            - name: OPENFGA_HTTP_CORS_ALLOWED_ORIGINS
              value: "*"
            - name: OPENFGA_HTTP_CORS_ALLOWED_HEADERS
              value: "*"

            - name: OPENFGA_PLAYGROUND_ENABLED
              value: "true"
            - name: OPENFGA_PLAYGROUND_PORT
              value: "3000"
            - name: OPENFGA_LOG_FORMAT
              value: json
            - name: OPENFGA_LOG_LEVEL
              value: info
            - name: OPENFGA_LOG_TIMESTAMP_FORMAT
              value: Unix
            - name: OPENFGA_REQUEST_DURATION_DATASTORE_QUERY_COUNT_BUCKETS
              value: "50,200"

            - name: OPENFGA_METRICS_ENABLED
              value: "true"
            - name: OPENFGA_METRICS_ADDR
              value: "0.0.0.0:2112"
          readinessProbe:
            failureThreshold: 6
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
            grpc:
              port: 8081
          livenessProbe:
            failureThreshold: 12
            initialDelaySeconds: 60
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
            grpc:
              port: 8081

          resources:
            {}
---
apiVersion: batch/v1
kind: Job
metadata:
  namespace: lumewarp
  name: lumewarp-openfga-migrate
  labels:
    app.kubernetes.io/name: openfga
    app.kubernetes.io/instance: lumewarp
    app.kubernetes.io/component: authorization-controller
    app.kubernetes.io/version: "v1.22.1"
    app.kubernetes.io/part-of: openfga
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openfga
        app.kubernetes.io/instance: lumewarp
        app.kubernetes.io/component: authorization-controller
        app.kubernetes.io/version: "v1.22.1"
        app.kubernetes.io/part-of: openfga
    spec:
      serviceAccountName: lumewarp-openfga
      initContainers:
        - command:
          - sh
          - -c
          - until pg_isready -h lumewarp-postgres -p 5432; do sleep 2; done
          image: postgres:17.12-alpine
          name: wait-for-postgres
      containers:
        - name: migrate-database
          securityContext:
            {}
          image: "openfga/openfga:v1.22.1"
          args: ["migrate"]
          env:
            - name: OPENFGA_DATASTORE_ENGINE
              value: "postgres"
            - name: OPENFGA_DATASTORE_URI
              valueFrom:
                secretKeyRef:
                  name: "lumewarp-openfga-datastore"
                  key: uri

          resources:
            {}
      restartPolicy: Never
  backoffLimit: 1
