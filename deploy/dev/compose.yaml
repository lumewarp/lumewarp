# Local development dependencies for Lumewarp.
# Postgres listens on 127.0.0.1:55432 and Valkey on 127.0.0.1:56379 so they never
# collide with another project's on 5432 or 6379.
name: lumewarp-dev

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: lumewarp
      POSTGRES_USER: lumewarp
      POSTGRES_PASSWORD: lumewarp
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - lumewarp-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumewarp -d lumewarp"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Shared rate limits between the dev gateways (LUMEWARP_SHARED_LIMITS_REDIS_URL).
  # No persistence: the counts only cover the current minute.
  redis:
    image: valkey/valkey:8.1.11-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Dev-only OIDC IdP for SSO login testing. Only started with the `idp` profile,
  # so `scripts/dev-db.sh up` keeps starting Postgres alone.
  keycloak:
    profiles: ["idp"]
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: lumewarp
      # Fixed issuer so discovery and `LUMEWARP_OIDC_ISSUER` always agree.
      KC_HOSTNAME: http://127.0.0.1:18080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro

  # Dev-only OpenFGA, started only with the `openfga` profile (`DEV_AUTHZ=openfga make dev`).
  # Uses its in-memory datastore: tuples and models are gone after a restart, and
  # `lumewarp-control-plane openfga init` seeds the model again.
  openfga:
    profiles: ["openfga"]
    image: openfga/openfga:v1.22.0
    command:
      - run
      - --http-addr=0.0.0.0:8080
      - --grpc-addr=0.0.0.0:8081
      - --datastore-engine=memory
      - --playground-enabled=false
      - --metrics-enabled=false
    ports:
      - "127.0.0.1:18081:8080"

  # The extras below start only with `DEV_EXTRAS=1 make dev` (profile `extras`).

  # Prometheus on 127.0.0.1:19090 scraping the dev gateways and control plane, with the
  # shipped rules; no persistence.
  prometheus:
    profiles: ["extras"]
    image: prom/prometheus:v3.5.0
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --web.listen-address=127.0.0.1:19090
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ../prometheus/rules.yaml:/etc/prometheus/rules.yaml:ro

  # Alertmanager on 127.0.0.1:19093: Prometheus sends it the shipped rules' alerts and it
  # posts them to the control plane's receiver (status banner and Incidents page).
  alertmanager:
    profiles: ["extras"]
    image: prom/alertmanager:v0.28.1
    network_mode: host
    command:
      - --config.file=/etc/alertmanager/alertmanager.yaml
      - --web.listen-address=127.0.0.1:19093
      - --cluster.listen-address=
    volumes:
      - ./alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro

  # Grafana on 127.0.0.1:13000 (anonymous admin) with the shipped dashboards.
  grafana:
    profiles: ["extras"]
    image: grafana/grafana:12.1.1
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "13000"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/lumewarp-overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro

  # Open WebUI with the demo key, for the gateway's OpenAI API and its aggregate MCP
  # endpoint. `make dev` starts it once the demo key exists.
  # Its connections come from the environment on every start, so settings changed in its
  # admin panel do not survive a restart; chats live in the volume.
  openwebui:
    profiles: ["extras"]
    image: ghcr.io/open-webui/open-webui:v0.12.5
    network_mode: host
    environment:
      PORT: "3000"
      HOST: 127.0.0.1
      WEBUI_AUTH: "False"
      WEBUI_SECRET_KEY: dev-only-open-webui-secret
      ENABLE_PERSISTENT_CONFIG: "False"
      ENABLE_OLLAMA_API: "False"
      OPENAI_API_BASE_URL: http://127.0.0.1:4000/v1
      OPENAI_API_KEY: ${DEV_DEMO_KEY:-}
      TOOL_SERVER_CONNECTIONS: >-
        [{"type":"mcp","url":"http://127.0.0.1:4000/mcp","path":"","auth_type":"none","key":"",
        "headers":{"X-Lumewarp-Key":"${DEV_DEMO_KEY:-}"},"config":{"enable":true},
        "info":{"id":"lumewarp","name":"Lumewarp","description":"Lumewarp gateway, every MCP server the demo key may use"}}]
      ENABLE_EVALUATION_ARENA_MODELS: "False"
      OFFLINE_MODE: "True"
      ANONYMIZED_TELEMETRY: "False"
      DO_NOT_TRACK: "True"
      SCARF_NO_ANALYTICS: "True"
    volumes:
      - openwebui:/app/backend/data

volumes:
  lumewarp-pg:
  openwebui:
