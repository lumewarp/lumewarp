{{- if and .Values.controlPlane.enabled (not .Values.global.gatewayTokens.secretName) }}
{{- /* One fixed token per zone. `lookup` keeps a token across upgrades; a fresh render (or a
       new zone) gets a random 48-character value. */}}
{{- $name := include "lumewarp.gatewayTokens.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "lumewarp.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-tokens
type: Opaque
data:
{{- range $zone := splitList "," (include "lumewarp.gatewayTokenZones" .) }}
{{- $key := include "lumewarp.gatewayTokenKey" (dict "zone" $zone) }}
{{- $value := randAlphaNum 48 | b64enc }}
{{- if and $existing (hasKey ($existing.data | default dict) $key) }}
{{- $value = index $existing.data $key }}
{{- end }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
