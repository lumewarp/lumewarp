{{- if .Values.valkey.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lumewarp.valkey.name" . }}
  labels:
    {{- include "lumewarp.valkey.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: {{ .Values.valkey.service.port }}
      targetPort: redis
      protocol: TCP
  selector:
    {{- include "lumewarp.valkey.selectorLabels" . | nindent 4 }}
{{- end }}
