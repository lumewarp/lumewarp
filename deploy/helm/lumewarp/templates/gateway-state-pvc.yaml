{{- if and .Values.gateway.enabled .Values.gateway.stateDir.persistence.enabled (not .Values.gateway.stateDir.persistence.existingClaim) }}
{{- $persistence := .Values.gateway.stateDir.persistence }}
{{- if not (and (eq (len $persistence.accessModes) 1) (has "ReadWriteOnce" $persistence.accessModes)) }}
{{- fail "gateway.stateDir.persistence.accessModes must be [ReadWriteOnce] in P1; shared state across gateways is not supported" }}
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "lumewarp.gateway.name" . }}-state
  labels:
    {{- include "lumewarp.gateway.labels" . | nindent 4 }}
  {{- with $persistence.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml $persistence.accessModes | nindent 4 }}
  {{- with $persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $persistence.size }}
{{- end }}
