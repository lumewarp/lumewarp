{{- if .Values.controlPlane.enabled }}
{{- $oidc := .Values.controlPlane.oidc }}
{{- if and $oidc.issuer (not $oidc.secretKey.secretName) }}
{{- fail "controlPlane.oidc.secretKey.secretName is required when controlPlane.oidc.issuer is set: the control plane refuses to start with SSO and no LUMEWARP_SECRET_KEY" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lumewarp.controlPlane.name" . }}
  labels:
    {{- include "lumewarp.controlPlane.labels" . | nindent 4 }}
spec:
  # Always one pod: the compiler and rollover scheduler run once per installation.
  replicas: 1
  # One writer: the compiler and rollover scheduler must not run in two pods. Recreate
  # avoids overlap during upgrades.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "lumewarp.controlPlane.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lumewarp.controlPlane.selectorLabels" . | nindent 8 }}
      {{- with .Values.controlPlane.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.controlPlane.terminationGracePeriodSeconds }}
      {{- if and (eq .Values.controlPlane.authz.backend "openfga") .Values.controlPlane.authz.openfga.init }}
      initContainers:
        # Idempotent: creates the store and writes the model only when they are missing.
        - name: openfga-init
          image: {{ include "lumewarp.controlPlane.image" . | quote }}
          imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy }}
          command: [python, -m, lumewarp_control_plane, openfga, init]
          env:
            {{- include "lumewarp.controlPlane.authzEnv" . | nindent 12 }}
          {{- with .Values.controlPlane.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- end }}
      containers:
        - name: control-plane
          image: {{ include "lumewarp.controlPlane.image" . | quote }}
          imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy }}
          command:
            - python
            - -m
            - lumewarp_control_plane
          args:
            - serve
          ports:
            - name: http
              containerPort: {{ .Values.controlPlane.service.httpPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.controlPlane.service.grpcPort }}
              protocol: TCP
            {{- if .Values.controlPlane.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.controlPlane.service.metricsPort }}
              protocol: TCP
            {{- end }}
          envFrom:
            # Every key is a LUMEWARP_GATEWAY_ZONE_<ID>_TOKEN; see global.gatewayTokens.
            - secretRef:
                name: {{ include "lumewarp.gatewayTokens.secretName" . }}
          env:
            - name: LUMEWARP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "controlPlane.databaseUrl.secretName is required" .Values.controlPlane.databaseUrl.secretName }}
                  key: {{ .Values.controlPlane.databaseUrl.key }}
            - name: LUMEWARP_HTTP_BIND
              value: "0.0.0.0:{{ .Values.controlPlane.service.httpPort }}"
            - name: LUMEWARP_GRPC_BIND
              value: "0.0.0.0:{{ .Values.controlPlane.service.grpcPort }}"
            - name: LUMEWARP_ZONE
              value: {{ .Values.global.zone | quote }}
            - name: LUMEWARP_METRICS_BIND
              value: {{ ternary (printf "0.0.0.0:%v" .Values.controlPlane.service.metricsPort) "" .Values.controlPlane.metrics.enabled | quote }}
            - name: LUMEWARP_INITIAL_ADMIN_EMAIL
              value: {{ .Values.controlPlane.initialAdminEmail | quote }}
            {{- if .Values.controlPlane.breakGlass.passwordHashSecret.name }}
            - name: LUMEWARP_BREAK_GLASS_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controlPlane.breakGlass.passwordHashSecret.name }}
                  key: {{ .Values.controlPlane.breakGlass.passwordHashSecret.key }}
            {{- end }}
            {{- if .Values.controlPlane.alertmanager.tokenSecret.name }}
            - name: LUMEWARP_ALERTMANAGER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controlPlane.alertmanager.tokenSecret.name }}
                  key: {{ .Values.controlPlane.alertmanager.tokenSecret.key }}
            {{- end }}
            {{- if .Values.controlPlane.grpcTls.enabled }}
            - name: LUMEWARP_GRPC_TLS_CERT_FILE
              value: /etc/lumewarp/tls/{{ .Values.controlPlane.grpcTls.certKey }}
            - name: LUMEWARP_GRPC_TLS_KEY_FILE
              value: /etc/lumewarp/tls/{{ .Values.controlPlane.grpcTls.keyKey }}
            {{- end }}
            {{- if .Values.global.encryptionKey.secretName }}
            - name: LUMEWARP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.encryptionKey.secretName }}
                  key: {{ .Values.global.encryptionKey.key }}
            {{- end }}
            {{- if $oidc.issuer }}
            - name: LUMEWARP_OIDC_ISSUER
              value: {{ $oidc.issuer | quote }}
            - name: LUMEWARP_OIDC_REQUIRE_EMAIL_VERIFIED
              value: {{ $oidc.requireEmailVerified | quote }}
            {{- end }}
            {{- if $oidc.clientId }}
            - name: LUMEWARP_OIDC_CLIENT_ID
              value: {{ $oidc.clientId | quote }}
            {{- end }}
            {{- if $oidc.clientSecret.secretName }}
            - name: LUMEWARP_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $oidc.clientSecret.secretName }}
                  key: {{ $oidc.clientSecret.key }}
            {{- end }}
            {{- if $oidc.secretKey.secretName }}
            - name: LUMEWARP_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $oidc.secretKey.secretName }}
                  key: {{ $oidc.secretKey.key }}
            {{- end }}
            {{- if $oidc.publicUrl }}
            - name: LUMEWARP_PUBLIC_URL
              value: {{ $oidc.publicUrl | quote }}
            {{- end }}
            {{- include "lumewarp.controlPlane.authzEnv" . | nindent 12 }}
            {{- with .Values.controlPlane.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          {{- with .Values.controlPlane.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.controlPlane.grpcTls.enabled }}
          volumeMounts:
            - name: grpc-tls
              mountPath: /etc/lumewarp/tls
              readOnly: true
          {{- end }}
      {{- if .Values.controlPlane.grpcTls.enabled }}
      volumes:
        - name: grpc-tls
          secret:
            secretName: {{ required "controlPlane.grpcTls.secretName is required when grpcTls.enabled" .Values.controlPlane.grpcTls.secretName }}
            items:
              - key: {{ .Values.controlPlane.grpcTls.certKey }}
                path: {{ .Values.controlPlane.grpcTls.certKey }}
              - key: {{ .Values.controlPlane.grpcTls.keyKey }}
                path: {{ .Values.controlPlane.grpcTls.keyKey }}
      {{- end }}
      {{- with .Values.controlPlane.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
