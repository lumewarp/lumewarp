{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "lumewarp.fullname" . }}
  labels:
    {{- include "lumewarp.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- $rules := required "bundled files/prometheus/rules.yaml is required" (.Files.Get "files/prometheus/rules.yaml") }}
  {{- $rules | nindent 2 }}
{{- end }}
