{{- if .Values.redis.enabled }}
{{- $values := .Values.redis }}
{{- $secretName := include "lumewarp.redis.secretName" . }}
{{- $secretKey := include "lumewarp.redis.secretKey" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lumewarp.redis.name" . }}
  labels:
    {{- include "lumewarp.redis.labels" . | nindent 4 }}
spec:
  # One replica on purpose: every key the shared limiter writes expires within 150 s, so
  # a restart only means a short window of per-gateway counts. A second replica would need
  # replication the limiter does not speak to.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "lumewarp.redis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lumewarp.redis.selectorLabels" . | nindent 8 }}
      {{- with $values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $podSecurityContext := mergeOverwrite (dict "runAsNonRoot" true "runAsUser" 999 "runAsGroup" 1000 "fsGroup" 1000 "fsGroupChangePolicy" "OnRootMismatch") ($values.podSecurityContext | default (dict)) }}
      securityContext:
        {{- toYaml $podSecurityContext | nindent 8 }}
      containers:
        - name: valkey
          image: {{ printf "%s:%s" $values.image.repository (required "redis.image.tag is required: pin an exact Valkey tag" $values.image.tag) | quote }}
          imagePullPolicy: {{ $values.image.pullPolicy }}
          # The image's entrypoint wants to be root to chown /data, so it is bypassed and
          # the server runs directly as the image's `valkey` user. No persistence: the
          # limiter's keys are all short-lived. The password goes into a config file on the
          # /data emptyDir instead of the command line, where it would sit in
          # /proc/1/cmdline for every process in the pod (and for `kubectl debug`) to read.
          command:
            - sh
            - -c
            - |
              set -eu
              password="$(cat /etc/lumewarp-redis/password)"
              umask 077
              printf 'requirepass %s\n' "$password" > /data/valkey.conf
              exec valkey-server /data/valkey.conf --save "" --appendonly no --dir /data
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          # The password reaches the probe through a file: an exec probe starts a new
          # process and does not inherit the container's environment.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - REDISCLI_AUTH="$(cat /etc/lumewarp-redis/password)" valkey-cli -h 127.0.0.1 -p 6379 ping | grep -q PONG
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - REDISCLI_AUTH="$(cat /etc/lumewarp-redis/password)" valkey-cli -h 127.0.0.1 -p 6379 ping | grep -q PONG
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml $values.resources | nindent 12 }}
          securityContext:
            {{- toYaml $values.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            # The password never lands in this manifest or in an environment variable.
            - name: auth
              mountPath: /etc/lumewarp-redis
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: auth
          secret:
            secretName: {{ $secretName }}
            items:
              - key: {{ $secretKey }}
                path: password
      {{- with $values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
