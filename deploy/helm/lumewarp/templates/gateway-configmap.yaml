{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lumewarp.gateway.name" . }}-config
  labels:
    {{- include "lumewarp.gateway.labels" . | nindent 4 }}
data:
  # Control-plane mode only reads the `server:` block from --local-config; upstreams,
  # models, routers, teams and keys come from the control-plane snapshot.
  config.yaml: |
    server:
      listen: {{ .Values.gateway.server.listen | quote }}
      admin_listen: {{ .Values.gateway.server.adminListen | quote }}
      shutdown_grace_ms: {{ .Values.gateway.server.shutdownGraceMs }}
      header_read_timeout_ms: {{ .Values.gateway.server.headerReadTimeoutMs }}
      body_read_timeout_ms: {{ .Values.gateway.server.bodyReadTimeoutMs }}
{{- end }}
