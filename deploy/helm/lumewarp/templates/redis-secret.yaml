{{- if and .Values.redis.enabled (not .Values.redis.auth.existingSecret) }}
{{- $name := include "lumewarp.redis.name" . }}
{{- $key := include "lumewarp.redis.secretKey" . }}
{{- /*
Keep the password across upgrades: `lookup` reads the Secret already in the cluster and
reuses its value. `helm template` and `helm install --dry-run` have no cluster to ask, so
they render a new random password (and a diff against a live release shows one).
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := "" }}
{{- if and $existing (hasKey ($existing.data | default (dict)) $key) }}
{{- $password = index $existing.data $key | b64dec }}
{{- end }}
{{- if not $password }}
{{- $password = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "lumewarp.redis.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $key }}: {{ $password | b64enc | quote }}
{{- end }}
