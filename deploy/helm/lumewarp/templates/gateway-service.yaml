{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lumewarp.gateway.name" . }}
  labels:
    {{- include "lumewarp.gateway.labels" . | nindent 4 }}
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http
      protocol: TCP
    # Keep the admin listener on a Service port so a ServiceMonitor (or a manually
    # configured scrape) can reach /metrics without a pod-level relabel.
    - name: admin
      port: {{ .Values.gateway.service.adminPort }}
      targetPort: admin
      protocol: TCP
  selector:
    {{- include "lumewarp.gateway.selectorLabels" . | nindent 4 }}
{{- end }}
