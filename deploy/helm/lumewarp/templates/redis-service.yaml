{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lumewarp.redis.name" . }}
  labels:
    {{- include "lumewarp.redis.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: {{ .Values.redis.service.port }}
      targetPort: redis
      protocol: TCP
  selector:
    {{- include "lumewarp.redis.selectorLabels" . | nindent 4 }}
{{- end }}
