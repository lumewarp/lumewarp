{{- if .Values.serviceMonitor.enabled }}
{{- $gateway := .Values.gateway.enabled }}
{{- $controlPlane := and .Values.controlPlane.enabled .Values.controlPlane.metrics.enabled }}
{{- if not (or $gateway $controlPlane) }}
{{- fail "serviceMonitor.enabled requires gateway.enabled=true or controlPlane.enabled=true with controlPlane.metrics.enabled=true" }}
{{- end }}
{{- if $gateway }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "lumewarp.gateway.name" . }}
  labels:
    {{- include "lumewarp.gateway.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "lumewarp.gateway.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: admin
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      {{- with .Values.serviceMonitor.scrapeTimeout }}
      scrapeTimeout: {{ . }}
      {{- end }}
{{- end }}
{{- if $controlPlane }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "lumewarp.controlPlane.name" . }}
  labels:
    {{- include "lumewarp.controlPlane.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "lumewarp.controlPlane.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      {{- with .Values.serviceMonitor.scrapeTimeout }}
      scrapeTimeout: {{ . }}
      {{- end }}
{{- end }}
{{- end }}
