# Default values for the lumewarp chart: a control plane (API, Admin UI, config stream) and
# a gateway (Rust data plane) that keeps its last ACKed snapshot on a local state volume.
# Both images are published with each release; the tag defaults to the chart appVersion.

# Per-chart naming (top level, as Helm charts conventionally do, so a parent chart can
# set them for this subchart only).
nameOverride: ""
fullnameOverride: ""

global:
  # Image tag of both components. Empty = the chart appVersion; a component's own image.tag wins.
  imageTag: ""
  imagePullSecrets: []
  # Extra labels on every resource.
  commonLabels: {}
  # Config zone this installation publishes and the gateway serves.
  zone: default
  # Gateway credentials: one fixed token per zone, read by the control plane at startup.
  # Empty secretName = the chart creates <fullname>-gateway-tokens with a random 48-character
  # token per zone (kept across upgrades with `lookup`); set it to use an existing Secret that
  # holds the LUMEWARP_GATEWAY_ZONE_<ID>_TOKEN keys instead.
  gatewayTokens:
    secretName: ""
    # More zones the control plane serves; global.zone is always included. The gateway pod
    # uses global.zone's key, so other zones need their own gateway release.
    zones: []
  # Existing Secret with LUMEWARP_ENCRYPTION_KEY (32+ characters) that seals stored upstream
  # API keys; both components get it. Required once an upstream stores a key; changing it makes stored keys unreadable.
  encryptionKey:
    secretName: ""
    key: encryption-key

controlPlane:
  enabled: true
  # Always one pod: the compiler and rollover scheduler run once per installation (Recreate strategy).
  image:
    repository: ghcr.io/lumewarp/lumewarp-control-plane
    tag: ""
    pullPolicy: IfNotPresent
  # Existing Secret with the SQLAlchemy async URL (postgresql+asyncpg://user:password@host:5432/db).
  databaseUrl:
    secretName: lumewarp-control-plane
    key: database-url
  # Email that becomes proxy_admin on its first verified OIDC login while none exists.
  initialAdminEmail: ""
  # Optional Secret with an argon2id password hash that enables emergency password login.
  breakGlass:
    passwordHashSecret:
      name: ""
      key: password-hash
  # SSO login. Rendered only when set; issuer requires secretKey.secretName (the control plane refuses to start without it).
  oidc:
    issuer: ""
    clientId: ""
    # Existing Secret with the client secret; empty for a public PKCE client.
    clientSecret:
      secretName: ""
      key: client-secret
    # Existing Secret with LUMEWARP_SECRET_KEY (32+ random characters) for the login-state cookie.
    secretKey:
      secretName: ""
      key: secret-key
    # External base URL; the redirect URI is <publicUrl>/api/v1/session/oidc/callback.
    publicUrl: ""
    # Require the IdP's email_verified claim before an email links or creates a user; false trusts it.
    requireEmailVerified: true
  # Authorization backend (LUMEWARP_AUTHZ_BACKEND): builtin, openfga, http or a `lumewarp.authz` plugin name; settings of http and plugins go in extraEnv.
  authz:
    backend: builtin
    openfga:
      url: ""
      # The store by name (looked up at startup), or by id when storeId is set.
      store: lumewarp
      storeId: ""
      # Empty = the store's latest model.
      modelId: ""
      # Existing Secret with a bearer token for OpenFGA's API, if it needs one.
      apiTokenSecret:
        name: ""
        key: api-token
      # Names in an existing store that differ from Lumewarp's.
      objectTypes: {}
      relations: {}
      # Init container that creates a missing store and writes a missing model (never replaces one); the pod waits for OpenFGA.
      init: false
  service:
    type: ClusterIP
    httpPort: 8091
    grpcPort: 50051
    metricsPort: 9465
  # Serve lumewarp_cp_* metrics on service.metricsPort; off = the port is not exposed.
  metrics:
    enabled: true
  # TLS for the gateway-facing gRPC listener, both files from one Secret; the gateway verifies with the WebPKI roots, so a private CA does not work.
  grpcTls:
    enabled: false
    secretName: ""
    certKey: tls.crt
    keyKey: tls.key
  # Pre-install/pre-upgrade Job running the database migration; the database must be reachable at install time.
  migrate:
    enabled: true
    backoffLimit: 3
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Extra container env entries (an `http` authz backend's settings, LUMEWARP_OIDC_SCOPES, ...).
  extraEnv: []
  # Readiness drains background services; uvicorn allows about 10 s of graceful shutdown.
  terminationGracePeriodSeconds: 20

gateway:
  enabled: true
  # Every pod is its own gateway (the control plane assigns its id at handshake); all share the zone token. Rate limits are per gateway unless they share Valkey or Redis.
  replicaCount: 1
  # HorizontalPodAutoscaler; replaces replicaCount. The CPU target is an average over the pods' CPU requests, so no request means no scaling.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  # Rendered only when the gateway can have more than one pod; set exactly one of minAvailable and maxUnavailable.
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
    maxUnavailable: ""
  image:
    repository: ghcr.io/lumewarp/lumewarp-gateway
    tag: ""
    pullPolicy: IfNotPresent
  # Empty = this release's control-plane Service on controlPlane.service.grpcPort; required when controlPlane.enabled=false.
  controlPlaneUrl: ""
  # Listener timeouts; the listen addresses follow service.port and service.adminPort.
  server:
    shutdownGraceMs: 25000
    headerReadTimeoutMs: 30000
    bodyReadTimeoutMs: 30000
  # Off = a Deployment with an emptyDir state directory (a new pod is unready until the control plane sends a snapshot).
  # On = a StatefulSet with one ReadWriteOnce claim per pod, so a restarted pod serves its cached snapshot at once.
  persistence:
    enabled: false
    # Fixed once the StatefulSet exists; changing size, storageClass or annotations needs the StatefulSet deleted with --cascade=orphan.
    size: 1Gi
    storageClass: ""
    annotations: {}
  # WASM plugins (router strategies, upstream auth, A2A middleware): `.wasm` files read once at startup, so a replaced file needs a pod restart.
  plugins:
    # Existing volume source rendered as is (mounted at /etc/lumewarp/plugins with router/, auth/ and a2a-middleware/ below it, all three must exist); empty = no plugins.
    volume: {}
    # Process-wide WASM memory budget in bytes; empty = the gateway default (1 GiB).
    memoryLimitBytes: ""
    # Existing Secrets whose keys become env variables; name each key LUMEWARP_PLUGIN_SECRET_<NAME> (one namespace for every plugin).
    secretEnvs: []
  # External base URL of the MCP and A2A endpoints, used for agent cards; empty = A2A answers 503.
  publicUrl: ""
  # Existing Secret with LUMEWARP_GATEWAY_ID_KEY (base64, 32+ bytes), identical on every gateway; empty = MCP and A2A answer 503.
  idKey:
    secretName: ""
    key: gateway-id-key
  # Rate limits across gateways through an external Redis; exclusive with valkey.enabled.
  sharedLimits:
    redis:
      # Secret whose key holds the full redis:// or rediss:// URL.
      existingSecret: ""
      existingSecretKey: url
    # Sync interval in milliseconds, 10 to 1000; empty = the gateway default (100).
    syncMs: ""
    # Namespace of the Redis keys; empty = the zone. Gateways that share counts must use the same one.
    namespace: ""
  service:
    type: ClusterIP
    port: 4000
    adminPort: 9464
  # OTLP/HTTP traces, where a request is looked up by its x-lumewarp-request-id.
  otel:
    # Base URL of the collector (/v1/traces is appended); empty = no traces.
    endpoint: ""
    # Share of requests exported, 0 to 1; keep 1 when traces serve as the access log.
    samplingRatio: 1
  # Must exceed server.shutdownGraceMs / 1000 + 5 s (OTLP exporter shutdown) + margin.
  terminationGracePeriodSeconds: 35
  podAnnotations: {}
  # The image runs as 65532:65532; fsGroup makes the state volume writable for that user.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    fsGroupChangePolicy: OnRootMismatch
  securityContext: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# One Valkey in this release for shared rate limits across gateway replicas (nothing persisted; keys expire within 150 s).
valkey:
  enabled: false
  image:
    repository: valkey/valkey
    tag: 8.1.11-alpine
    pullPolicy: IfNotPresent
  # Empty existingSecret = the chart creates a random password once (kept by `lookup`); your own Secret's key holds just a URL-safe password.
  auth:
    existingSecret: ""
    existingSecretKey: password
  service:
    port: 6379
  # The image's valkey user is 999:1000; /data is an emptyDir and the root filesystem is read-only.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 30m
      memory: 64Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Prometheus Operator and Grafana integration.
monitoring:
  # ServiceMonitors for the gateway admin listener and the control-plane metrics port; needs the Operator CRDs.
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: ""
    labels: {}
  # PrometheusRule with the recording rules and alerts; needs the Operator CRDs.
  prometheusRule:
    enabled: false
    # Match your Prometheus ruleSelector.
    labels: {}
  # ConfigMap with the bundled dashboards for the Grafana sidecar.
  grafanaDashboards:
    enabled: false
    sidecarLabel: grafana_dashboard
    sidecarLabelValue: "1"
