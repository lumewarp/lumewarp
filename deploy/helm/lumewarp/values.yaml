# Default values for the lumewarp chart.
#
# The chart deploys two components:
#   - controlPlane: FastAPI HTTP API + Admin UI, gRPC config/usage services, config
#     compiler, budget rollover scheduler and a Prometheus metrics listener.
#   - gateway: Rust data plane. It follows the control-plane config stream and keeps its
#     last ACKed snapshot on a local state volume.
#
# Images are not built by this chart. Build and push them, then set
# image.repository and image.tag. The gateway image must contain the `lumewarp` binary;
# the control-plane image must contain the `lumewarp_control_plane` Python package (and
# the built Admin UI if it should be served at /).

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []
commonLabels: {}

# Existing Secret holding LUMEWARP_ENCRYPTION_KEY (at least 32 characters). It seals the
# upstream API keys stored in the database; the control plane and the gateway both get it.
# Required once an upstream stores an API key. Changing it makes stored keys unreadable
# until they are entered again.
encryptionKey:
  secretName: ""
  key: encryption-key

controlPlane:
  enabled: true
  # The gRPC server, compiler loop and rollover scheduler must run exactly once per
  # installation. Scaling this Deployment is not supported.
  replicaCount: 1
  image:
    repository: ghcr.io/lumewarp/lumewarp-control-plane
    # Empty = .Chart.AppVersion.
    tag: ""
    pullPolicy: IfNotPresent
  # Existing Secret holding the SQLAlchemy async URL, e.g.
  # postgresql+asyncpg://user:password@postgres:5432/lumewarp
  databaseUrl:
    secretName: lumewarp-control-plane
    key: database-url
  # Email that becomes proxy_admin on its first verified OIDC login while no proxy_admin
  # exists. Empty = emergency access only (break-glass can assign the first one).
  initialAdminEmail: ""
  # Optional existing Secret containing an argon2id password hash.
  breakGlass:
    passwordHashSecret:
      name: ""
      key: password-hash
  # Snapshot scope this installation publishes; gateways must use the same value.
  scope: default
  service:
    type: ClusterIP
    httpPort: 8091
    grpcPort: 50051
    # Prometheus metrics listener (LUMEWARP_METRICS_BIND), separate from the admin API.
    metricsPort: 9465
  # Serve lumewarp_cp_* metrics on service.metricsPort. Disabled = LUMEWARP_METRICS_BIND
  # is empty and the port is not exposed.
  metrics:
    enabled: true
  # Optional TLS for the gateway-facing gRPC listener. Both files are read from one
  # Secret. The gateway verifies with the WebPKI root store, so a private CA certificate
  # will not work unless that CA is installed in the gateway image. When enabled and
  # gateway.controlPlaneUrl is empty, the gateway URL defaults to https://.
  grpcTls:
    enabled: false
    secretName: ""
    certKey: tls.crt
    keyKey: tls.key
  # Run `python -m lumewarp_control_plane migrate` as a pre-install/pre-upgrade Job.
  # Requires the database to exist and be reachable when Helm installs the release.
  migrate:
    enabled: true
    backoffLimit: 3
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # SSO needs LUMEWARP_SECRET_KEY, passed here with a secretKeyRef (see the chart README).
  extraEnv: []
  extraArgs: []
  # Readiness drains background services; uvicorn allows about 10 s of graceful shutdown.
  terminationGracePeriodSeconds: 20

gateway:
  enabled: true
  # One gateway token is bound to one gateway id; multi-replica gateways are not
  # supported. The chart rejects replicaCount > 1; deploy one release per gateway identity.
  replicaCount: 1
  image:
    repository: ghcr.io/lumewarp/lumewarp-gateway
    tag: ""
    pullPolicy: IfNotPresent
  # Existing Secret holding a gateway token created by the control plane (`lwg-...`).
  # See the chart README for the bootstrap order.
  token:
    secretName: lumewarp-gateway
    key: token
  # Environment variable that carries the token to the gateway. The token is never
  # written to the state volume.
  tokenEnvVar: LUMEWARP_GATEWAY_TOKEN
  # Empty = http://<control-plane Service>:<controlPlane.service.grpcPort> in this namespace.
  controlPlaneUrl: ""
  # Empty = controlPlane.scope.
  scope: ""
  # Required: the gateway id this token was issued for. It is never derived from the
  # pod name. Change it together with `bootstrap --gateway-id` and the token Secret.
  # The default matches the documented install example.
  gatewayId: "gw-1"
  # Local listener settings. Only the `server:` block is used in control-plane mode.
  # adminListen must be reachable from the kubelet for /readyz and /metrics probes.
  server:
    listen: "0.0.0.0:4000"
    adminListen: "0.0.0.0:9464"
    shutdownGraceMs: 25000
    headerReadTimeoutMs: 30000
    bodyReadTimeoutMs: 30000
  stateDir:
    path: /var/lib/lumewarp
    # emptyDir is the default, so a pod without a cached snapshot cold-boots from the
    # control plane. Enable persistence for a ReadWriteOnce PVC-backed snapshot.
    persistence:
      enabled: false
      # Use an existing claim instead of creating one. It must be ReadWriteOnce and
      # used by this single gateway replica.
      existingClaim: ""
      storageClass: ""
      # Only ReadWriteOnce is supported; shared state across gateways is not.
      accessModes:
        - ReadWriteOnce
      size: 1Gi
      # For example {helm.sh/resource-policy: keep} to survive `helm uninstall`.
      annotations: {}
  service:
    type: ClusterIP
    port: 4000
    adminPort: 9464
  # OTLP/HTTP traces. The gateway writes no access log: this is where one request is looked
  # up, by the x-lumewarp-request-id of its response. See "Looking up a request" in the
  # chart README for what the lookup depends on.
  otel:
    # Base URL, for example http://otel-collector.observability:4318 (/v1/traces is
    # appended). Empty = no traces, and nothing to look a request up in.
    endpoint: ""
    # Share of requests exported, 0 to 1, decided by the gateway and not by the client's
    # traceparent. Keep 1 if this is used as an access log.
    samplingRatio: 1
  # Must exceed server.shutdownGraceMs / 1000 + 5 s (OTLP exporter shutdown) + margin.
  terminationGracePeriodSeconds: 35
  podAnnotations: {}
  # The gateway image runs as 65532:65532. fsGroup makes emptyDir and RWO PVC mounts
  # writable by that user; override only if a custom image uses another UID/GID.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    fsGroupChangePolicy: OnRootMismatch
  securityContext: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []
  extraArgs: []

serviceMonitor:
  # Requires the Prometheus Operator CRDs. Renders one ServiceMonitor for the gateway admin
  # listener (gateway.enabled) and one for the control-plane metrics port
  # (controlPlane.enabled and controlPlane.metrics.enabled).
  enabled: false
  interval: 30s
  scrapeTimeout: ""
  labels: {}

prometheusRule:
  # Requires the Prometheus Operator CRDs. Contains recording rules and alerts.
  enabled: false
  # Match your Prometheus ruleSelector (e.g. release: kube-prometheus-stack).
  labels: {}

grafanaDashboards:
  enabled: false
  # Match the Grafana sidecar's label and labelValue settings.
  sidecarLabel: grafana_dashboard
  sidecarLabelValue: "1"
