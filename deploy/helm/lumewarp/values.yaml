# Default values for the lumewarp chart.
#
# The chart deploys two components:
#   - controlPlane: FastAPI HTTP API + Admin UI, gRPC config/usage services, config
#     compiler, budget rollover scheduler and a Prometheus metrics listener.
#   - gateway: Rust data plane. It follows the control-plane config stream and keeps its
#     last ACKed snapshot on a local state volume.
#
# Images are not built by this chart. Build and push them, then set
# image.repository and image.tag. The gateway image must contain the `lumewarp` binary;
# the control-plane image must contain the `lumewarp_control_plane` Python package (and
# the built Admin UI if it should be served at /).

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []
commonLabels: {}

# Existing Secret holding LUMEWARP_ENCRYPTION_KEY (at least 32 characters). It seals the
# upstream API keys stored in the database; the control plane and the gateway both get it.
# Required once an upstream stores an API key. Changing it makes stored keys unreadable
# until they are entered again.
encryptionKey:
  secretName: ""
  key: encryption-key

controlPlane:
  enabled: true
  # The gRPC server, compiler loop and rollover scheduler must run exactly once per
  # installation. Scaling this Deployment is not supported.
  replicaCount: 1
  image:
    repository: ghcr.io/lumewarp/lumewarp-control-plane
    # Empty = .Chart.AppVersion.
    tag: ""
    pullPolicy: IfNotPresent
  # Existing Secret holding the SQLAlchemy async URL, e.g.
  # postgresql+asyncpg://user:password@postgres:5432/lumewarp
  databaseUrl:
    secretName: lumewarp-control-plane
    key: database-url
  # Email that becomes proxy_admin on its first verified OIDC login while no proxy_admin
  # exists. Empty = emergency access only (break-glass can assign the first one).
  initialAdminEmail: ""
  # Optional existing Secret containing an argon2id password hash.
  breakGlass:
    passwordHashSecret:
      name: ""
      key: password-hash
  # Snapshot scope this installation publishes; gateways must use the same value.
  scope: default
  service:
    type: ClusterIP
    httpPort: 8091
    grpcPort: 50051
    # Prometheus metrics listener (LUMEWARP_METRICS_BIND), separate from the admin API.
    metricsPort: 9465
  # Serve lumewarp_cp_* metrics on service.metricsPort. Disabled = LUMEWARP_METRICS_BIND
  # is empty and the port is not exposed.
  metrics:
    enabled: true
  # Optional TLS for the gateway-facing gRPC listener. Both files are read from one
  # Secret. The gateway verifies with the WebPKI root store, so a private CA certificate
  # will not work unless that CA is installed in the gateway image. When enabled and
  # gateway.controlPlaneUrl is empty, the gateway URL defaults to https://.
  grpcTls:
    enabled: false
    secretName: ""
    certKey: tls.crt
    keyKey: tls.key
  # Run `python -m lumewarp_control_plane migrate` as a pre-install/pre-upgrade Job.
  # Requires the database to exist and be reachable when Helm installs the release.
  migrate:
    enabled: true
    backoffLimit: 3
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # SSO needs LUMEWARP_SECRET_KEY, passed here with a secretKeyRef (see "SSO and authorization backend" in docs/operations/helm.md).
  extraEnv: []
  extraArgs: []
  # Readiness drains background services; uvicorn allows about 10 s of graceful shutdown.
  terminationGracePeriodSeconds: 20

gateway:
  enabled: true
  # Replicas of one release share the token and gateway.gatewayId: they are the same
  # gateway and appear as its instances in the Admin UI (so a rolling update never runs two
  # gateway identities). Rate limits are counted per instance unless the gateways share a
  # Redis: see redis.enabled and gateway.sharedLimits below.
  replicaCount: 1
  # HorizontalPodAutoscaler (autoscaling/v2) for the gateway. When enabled it replaces
  # replicaCount: the workload carries no fixed replica count and the HPA keeps between
  # minReplicas and maxReplicas pods. The CPU target is an average over the pods' CPU
  # requests (gateway.resources), so a target of 0 or no request never scales.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  # Only rendered when enabled and the gateway can have more than one pod (replicaCount > 1
  # or autoscaling). Set exactly one of minAvailable and maxUnavailable: minAvailable: 1
  # keeps one pod serving while a node drains.
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
    maxUnavailable: ""
  image:
    repository: ghcr.io/lumewarp/lumewarp-gateway
    tag: ""
    pullPolicy: IfNotPresent
  # Existing Secret holding a gateway token created by the control plane (`lwg-...`).
  # See the chart README for the bootstrap order.
  token:
    secretName: lumewarp-gateway
    key: token
  # Environment variable that carries the token to the gateway. The token is never
  # written to the state volume.
  tokenEnvVar: LUMEWARP_GATEWAY_TOKEN
  # Empty = http://<control-plane Service>:<controlPlane.service.grpcPort> in this namespace.
  controlPlaneUrl: ""
  # Empty = controlPlane.scope.
  scope: ""
  # Required: the gateway id this token was issued for. It is never derived from the
  # pod name. Change it together with `bootstrap --gateway-id` and the token Secret.
  # The default matches the documented install example.
  gatewayId: "gw-1"
  # Local listener settings. Only the `server:` block is used in control-plane mode.
  # adminListen must be reachable from the kubelet for /readyz and /metrics probes.
  server:
    listen: "0.0.0.0:4000"
    adminListen: "0.0.0.0:9464"
    shutdownGraceMs: 25000
    headerReadTimeoutMs: 30000
    bodyReadTimeoutMs: 30000
  # WASM plugins. Components are not in the gateway image: a plugin is one `.wasm` file
  # in one of three directories, read once at startup, so replacing a file is a file
  # write plus a pod restart (`kubectl rollout restart`). Built-in strategies and auth
  # are native and never need a file.
  plugins:
    # Existing volume holding the components; a Kubernetes volume source rendered as is,
    # for example
    #   {persistentVolumeClaim: {claimName: gateway-plugins}}
    #   {configMap: {name: gateway-plugins, items: [{key: cheapest-first.wasm, path: router/cheapest-first.wasm}]}}
    # Empty = no plugin volume and no directory variables: nothing is loaded, which is
    # valid for LLM, MCP and A2A traffic alike.
    volume: {}
    # Where the volume is mounted. Each kind reads one directory below it, defined by
    # `dirs`; a directory that does not exist refuses to start the gateway, so create all
    # three even when they stay empty.
    mountPath: /etc/lumewarp/plugins
    # Directory per kind, member of the gateway's capability set:
    #   router        LUMEWARP_ROUTER_PLUGIN_DIR,     strategy:<name> per file
    #   auth          LUMEWARP_AUTH_PLUGIN_DIR,       auth:<name> per file
    #   a2aMiddleware LUMEWARP_A2A_MIDDLEWARE_DIR,    a2a_middleware:<name> per file
    dirs:
      router: router
      auth: auth
      a2aMiddleware: a2a-middleware
    # Process-wide WASM memory budget in bytes; every plugin instance is additionally
    # capped at 32 MiB. Empty = the gateway default, 1073741824 (1 GiB).
    memoryLimitBytes: ""
    # Existing Secrets whose keys become environment variables for the gateway. Name each
    # key LUMEWARP_PLUGIN_SECRET_<NAME>: an `upstream-auth` plugin reads those through
    # secret(), and the host exposes no variable without that prefix. The host does not
    # scope them per plugin, so put the plugin name in the key.
    secretEnvs: []
    #  - gateway-plugin-secrets
  # External base URL of the MCP and A2A endpoints, e.g. https://gateway.example.com
  # (no query, no userinfo). Agent-card URLs are built from it, never from the Host
  # header. Empty = the A2A endpoints answer 503; MCP and LLM traffic is unaffected.
  publicUrl: ""
  # Existing Secret holding LUMEWARP_GATEWAY_ID_KEY (base64, at least 32 bytes). It MACs
  # A2A task and context ids and, through HKDF, seals MCP sessions, so every gateway of
  # this installation must use the same value; it is never in a config snapshot. Empty =
  # the MCP and A2A endpoints answer 503; LLM traffic is unaffected.
  idKey:
    secretName: ""
    key: gateway-id-key
  stateDir:
    path: /var/lib/lumewarp
    # Off = the gateway is a Deployment and the state directory is an emptyDir, so a new
    # pod has no cached snapshot and stays unready until the control plane sends one.
    # On = a StatefulSet with one ReadWriteOnce claim per pod (the chart creates it), so a
    # restarted pod keeps its snapshot and serves before the control plane answers.
    persistence:
      enabled: false
      # size, storageClass and annotations are fixed once the StatefulSet exists: changing
      # one needs `kubectl delete statefulset ... --cascade=orphan` first (see
      # "State volume" in docs/operations/helm.md).
      storageClass: ""
      # One claim per pod; shared state across gateways is not a thing.
      accessModes:
        - ReadWriteOnce
      size: 1Gi
      # For example {helm.sh/resource-policy: keep} to survive `helm uninstall`.
      annotations: {}
  # Rate limits across gateways. By default rpm, tpm and max_parallel are counted per
  # gateway instance, so N replicas admit up to N times a key's limit. Point them at one
  # Redis (or Valkey) and the counts hold across every gateway of the installation that
  # uses it.
  sharedLimits:
    # An existing Redis instead of redis.enabled: a Secret whose key holds the full URL,
    # redis://:password@host:6379/0 or rediss://... Mutually exclusive with redis.enabled.
    redis:
      existingSecret: ""
      existingSecretKey: url
    # Sync interval in milliseconds, 10 to 1000. Empty = the gateway default (100). A
    # shorter interval is more accurate and more Redis traffic; the fair share between
    # syncs keeps 100 ms close to exact.
    syncMs: ""
    # Namespace of the Redis keys. Empty = the config scope (gateway.scope here).
    # Gateways that should share counts must use the same value.
    namespace: ""
  service:
    type: ClusterIP
    port: 4000
    adminPort: 9464
  # OTLP/HTTP traces. The gateway writes no access log: this is where one request is looked
  # up, by the x-lumewarp-request-id of its response. See "Looking up a request" in
  # docs/operations/observability.md for what the lookup depends on.
  otel:
    # Base URL, for example http://otel-collector.observability:4318 (/v1/traces is
    # appended). Empty = no traces, and nothing to look a request up in.
    endpoint: ""
    # Share of requests exported, 0 to 1, decided by the gateway and not by the client's
    # traceparent. Keep 1 if this is used as an access log.
    samplingRatio: 1
  # Must exceed server.shutdownGraceMs / 1000 + 5 s (OTLP exporter shutdown) + margin.
  terminationGracePeriodSeconds: 35
  podAnnotations: {}
  # The gateway image runs as 65532:65532. fsGroup makes emptyDir and RWO PVC mounts
  # writable by that user; override only if a custom image uses another UID/GID.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    fsGroupChangePolicy: OnRootMismatch
  securityContext: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []
  extraArgs: []

serviceMonitor:
  # Requires the Prometheus Operator CRDs. Renders one ServiceMonitor for the gateway admin
  # listener (gateway.enabled) and one for the control-plane metrics port
  # (controlPlane.enabled and controlPlane.metrics.enabled).
  enabled: false
  interval: 30s
  scrapeTimeout: ""
  labels: {}

prometheusRule:
  # Requires the Prometheus Operator CRDs. Contains recording rules and alerts.
  enabled: false
  # Match your Prometheus ruleSelector (e.g. release: kube-prometheus-stack).
  labels: {}

grafanaDashboards:
  enabled: false
  # Match the Grafana sidecar's label and labelValue settings.
  sidecarLabel: grafana_dashboard
  sidecarLabelValue: "1"

# One Valkey (Redis protocol, BSD-licensed) for shared rate limits, in this release.
# Enable it when gateway.replicaCount > 1 so a key's rpm, tpm and max_parallel hold across
# the replicas; a gateway-only release elsewhere points at the same server through
# gateway.sharedLimits.redis.existingSecret. Nothing is persisted: every key expires within
# 150 s, and a restart only means a short window of per-gateway counts.
redis:
  enabled: false
  image:
    repository: valkey/valkey
    # Pinned exact tag, no floating 8-alpine.
    tag: 8.1.11-alpine
    pullPolicy: IfNotPresent
  # The server password. Leave existingSecret empty and the chart creates a Secret once
  # (`lookup` keeps it across upgrades) holding a random 32-character password. With your
  # own Secret the key below holds just the password, and it must be URL-safe: the gateway
  # receives it inside a redis:// URL.
  auth:
    existingSecret: ""
    existingSecretKey: password
  service:
    port: 6379
  # The image's valkey user is 999:1000; /data is an emptyDir and the root filesystem is
  # read-only. Override only for a custom image.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 30m
      memory: 64Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
