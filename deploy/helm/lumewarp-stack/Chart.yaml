apiVersion: v2
name: lumewarp-stack
description: Lumewarp with an optional bundled PostgreSQL and OpenFGA, installed in one step
type: application
version: 0.3.0
appVersion: "0.3.0"
kubeVersion: ">=1.25.0-0"
keywords:
  - llm
  - gateway
  - openai
  - vllm
sources:
  - https://github.com/lumewarp/lumewarp
dependencies:
  # The lumewarp chart is a sibling directory: this chart is not published, it is installed
  # from a checkout (docs/operations/helm.md, "Full stack: lumewarp-stack").
  - name: lumewarp
    version: 0.3.0
    repository: file://../lumewarp
  - name: openfga
    version: 0.4.1
    repository: https://openfga.github.io/helm-charts
    condition: openfga.enabled
