{{- if and .Values.postgres.enabled (not .Values.postgres.auth.existingSecret) }}
{{- $password := include "stack.postgres.password" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stack.postgres.secretName" . }}
  labels:
    {{- include "stack.postgres.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
---
# What the lumewarp chart reads (controlPlane.databaseUrl). The name is fixed in values.yaml
# because umbrella values cannot use the release name.
apiVersion: v1
kind: Secret
metadata:
  name: lumewarp-stack-database
  labels:
    {{- include "stack.postgres.labels" . | nindent 4 }}
type: Opaque
data:
  database-url: {{ printf "postgresql+asyncpg://%s:%s@%s:5432/%s" .Values.postgres.auth.username $password (include "stack.postgres.name" .) .Values.postgres.auth.database | b64enc | quote }}
{{- if .Values.openfga.enabled }}
---
# OpenFGA's datastore (database "openfga" in the same server); key `uri` is what its chart reads.
apiVersion: v1
kind: Secret
metadata:
  name: lumewarp-stack-openfga-datastore
  labels:
    {{- include "stack.postgres.labels" . | nindent 4 }}
type: Opaque
data:
  uri: {{ printf "postgres://%s:%s@%s:5432/openfga?sslmode=disable" .Values.postgres.auth.username $password (include "stack.postgres.name" .) | b64enc | quote }}
{{- end }}
{{- end }}
