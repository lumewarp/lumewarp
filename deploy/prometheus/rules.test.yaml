  "tests": [
    {
      "name": "LumewarpGatewayHigh5xxRatio fires after hold",
      "interval": "1m",
      "input_series": [
        {
          "series": "lumewarp_requests_total{namespace=\"demo\",job=\"lumewarp-gateway\",instance=\"gw:9464\",requested=\"m\",endpoint=\"chat_completions\",status=\"200\"}",
          "values": "0+60x40"
        },
        {
          "series": "lumewarp_requests_total{namespace=\"demo\",job=\"lumewarp-gateway\",instance=\"gw:9464\",requested=\"m\",endpoint=\"chat_completions\",status=\"503\"}",
          "values": "0+60x40"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "0m",
          "alertname": "LumewarpGatewayHigh5xxRatio",
          "exp_alerts": []
        },
        {
          "eval_time": "30m",
          "alertname": "LumewarpGatewayHigh5xxRatio",
          "exp_alerts": [
            {
              "exp_labels": {
                "namespace": "demo",
                "requested": "m",
                "severity": "critical"
              },
              "exp_annotations": {
                "summary": "Gateway 5xx ratio is high",
                "description": "Model m exceeds 5% 5xx responses for 5 minutes at >=1 request/s.",
                "runbook": "Check upstream errors and routing dashboard; restore a healthy deployment or roll back routing."
              }
            }
          ]
        }
      ]
    },
    {
      "name": "LumewarpGatewayHigh5xxRatio healthy or threshold boundary",
      "interval": "1m",
      "input_series": [
        {
          "series": "lumewarp_requests_total{namespace=\"demo\",job=\"lumewarp-gateway\",instance=\"gw:9464\",requested=\"m\",endpoint=\"chat_completions\",status=\"200\"}",
          "values": "0+120x40"
        },
        {
          "series": "lumewarp_requests_total{namespace=\"demo\",job=\"lumewarp-gateway\",instance=\"gw:9464\",requested=\"m\",endpoint=\"chat_completions\",status=\"503\"}",
          "values": "0+0x40"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "30m",
          "alertname": "LumewarpGatewayHigh5xxRatio",
          "exp_alerts": []
        }
      ]
    },
