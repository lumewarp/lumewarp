[project]
name = "lumewarp-control-plane"
version = "0.1.0"
description = "Lumewarp control plane: management API, config compiler, plugins"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "asyncpg>=0.30",
    "authlib>=1.6,<2",
    "cryptography>=43",
    "fastapi>=0.115",
    "grpcio>=1.84",
    "grpcio-health-checking>=1.84",
    "httpx>=0.28",
    "jsonschema>=4.23",
    "prometheus-client>=0.26.0",
    "protobuf>=7.35.1",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
lumewarp-control-plane = "lumewarp_control_plane.__main__:main"

[dependency-groups]
dev = [
    "grpcio-tools==1.84.0",
    "httpx>=0.28",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumewarp_control_plane"]
# The built Admin UI (ui: `pnpm build:cp`) is gitignored, so name it explicitly to ship it.
artifacts = ["src/lumewarp_control_plane/static/**"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/lumewarp_control_plane/_proto"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated DDL keeps long SQL literals on one line.
"src/lumewarp_control_plane/migrations/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
