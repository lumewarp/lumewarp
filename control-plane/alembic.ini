# For authoring migrations with the alembic CLI, e.g.
#   uv run alembic revision --autogenerate -m "..."
# The URL comes from LUMEWARP_DATABASE_URL (see settings.py). Runtime code uses
# `python -m lumewarp_control_plane migrate` instead.
[alembic]
script_location = src/lumewarp_control_plane/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
